  return {
   q:`입력 필드는 ${lo} 이상 ${hi} 이하의 정수만 허용하고, 그 밖의 값은 거부한다.\n\n${v3?'3값':'2값'} 경계값 분석으로 100% 커버리지를 달성하기 위한 테스트 값으로 올바른 것은?`,
   ans:v3?three:two,
   wrongs:v3?[two,[lo-1,lo,lo+1,hi-1,hi,hi+1].join(', '),[lo,lo+1,hi-1,hi].join(', ')]
            :[[lo,hi].join(', '),three,[lo-1,lo+1,hi-1,hi+1].join(', ')],
   e:`분할은 {…${lo-1}}, {${lo}…${hi}}, {${hi+1}…}이고 경계값은 ${lo-1}, ${lo}, ${hi}, ${hi+1}이에요. `+
     (v3?`3값 BVA는 각 경계값과 그 양옆 값을 모두 테스트하므로 ${three}이에요.`:`2값 BVA는 각 경계값과 인접 분할의 가장 가까운 값이므로 ${two}이에요.`)
  };}},
 {id:'G-EP',lo:'4.2.1',k:'K3',name:'동등 분할 개수',make(){
  const names=['무료','어린이 요금','청소년 요금','성인 요금','경로 요금'],t=rand(3,5),lines=[];let st=0;
  for(let i=0;i<t;i++){
   if(i===t-1)lines.push(`${st}세 이상: ${names[i]}`);
   else{const en=st+rand(3,12);lines.push(`${st}~${en}세: ${names[i]}`);st=en+1;}
  }
  return {
   q:`놀이공원 요금은 나이(정수)에 따라 정해진다.\n\n${lines.join('\n')}\n음수 나이: 오류 메시지 표시\n\n동등 분할로 유효·무효 분할을 모두 커버하기 위한 최소 테스트 케이스 수는?`,
   ans:`${t+1}개`,wrongs:[`${t}개`,`${t+2}개`,`${t*2}개`],
   e:`유효 분할 ${t}개(요금 구간)와 무효 분할 1개(음수)로 총 ${t+1}개예요. 변수가 하나라 테스트 1개가 분할 1개만 커버해요.`
  };}},
 {id:'G-STMT',lo:'4.3.1',k:'K2',name:'구문 커버리지 겹침',make(){
  const x=rand(35,80),y=rand(Math.max(101-x,20),95);
  return {
   q:`같은 코드를 대상으로 테스트 T1은 ${x}%, 테스트 T2는 ${y}%의 구문 커버리지를 달성했다.\n\nT1과 T2가 모두 실행한 구문은 전체 구문의 최소 몇 %인가?`,
   ans:`${x+y-100}%`,wrongs:[`${Math.abs(x-y)}%`,`${100-x}%`,`${100-y}%`,'알 수 없다'],
   e:`두 커버리지의 합은 ${x+y}%인데 전체는 100%를 넘을 수 없어요. 따라서 최소 ${x+y-100}%는 두 테스트가 함께 실행한 구문이에요.`
  };}},
 {id:'G-3PT',lo:'5.1.4',k:'K3',name:'3점 추정',make(){
  let a,m,b;do{a=rand(2,10);m=a+rand(1,6);b=m+rand(3,15);}while((a+4*m+b)%6!==0);
  const E=(a+4*m+b)/6;
  return {
   q:`3점 추정 기법으로 테스트 노력을 추정한다.\n\n낙관치 = ${a}인일, 최빈치 = ${m}인일, 비관치 = ${b}인일\n\n추정치(E)는?`,
   ans:`${E}인일`,wrongs:[`${num((a+m+b)/3)}인일`,`${m}인일`,`${num((a+b)/2)}인일`],
   e:`E = (낙관치 + 4×최빈치 + 비관치) / 6 = (${a} + 4×${m} + ${b}) / 6 = ${E}인일. 표준편차는 (비관치 − 낙관치) / 6 = ${num((b-a)/6)}이에요.`
  };}},
 {id:'G-EXT',lo:'5.1.4',k:'K3',name:'외삽법 추정',make(){
  const A=[rand(4,15),rand(4,15),rand(4,15),rand(4,15)],ans=(3*A[3]+A[2])/4;
  return {
   q:`팀은 다음 외삽법 모델로 반복주기별 작업량(M/D)을 추정한다.\n\nE(n) = (3 × A(n−1) + A(n−2)) / 4\n(E: 예상 작업량, A: 실제 작업량)\n\n실제 작업량: A(1)=${A[0]}, A(2)=${A[1]}, A(3)=${A[2]}, A(4)=${A[3]}\n\n반복주기 #5의 예상 작업량은?`,
   ans:`${num(ans)} M/D`,wrongs:[`${num((A[2]+A[3])/2)} M/D`,`${num((3*A[2]+A[3])/4)} M/D`,`${num((A[0]+A[1]+A[2]+A[3])/4)} M/D`],
   e:`E(5) = (3 × A(4) + A(3)) / 4 = (3 × ${A[3]} + ${A[2]}) / 4 = ${num(ans)} M/D예요. A(4)에 가중치 3이 붙어요.`
  };}},
 {id:'G-RATIO',lo:'5.1.4',k:'K3',name:'비율 기반 추정',make(){
  const r=[0.1,0.15,0.2,0.25][rand(0,3)],d=[rand(4,12)*1e5,rand(4,12)*1e5,rand(4,12)*1e5],sum=d[0]+d[1]+d[2];
  const t1=Math.round(d[0]*r*(0.6+Math.random()*0.8)/1e4)*1e4,t2=Math.round(d[1]*r*(0.6+Math.random()*0.8)/1e4)*1e4,t3=Math.round(sum*r)-t1-t2;
  if(t1<=0||t2<=0||t3<=0)return null;
  const nd=rand(5,15)*1e5,ans=nd*r;
  return {
   q:`비율 기반 추정으로 새 프로젝트의 테스트 노력을 추정한다. 유사한 과거 프로젝트 데이터는 다음과 같다.\n\nP1: 개발 ${usd(d[0])} / 테스트 ${usd(t1)}\nP2: 개발 ${usd(d[1])} / 테스트 ${usd(t2)}\nP3: 개발 ${usd(d[2])} / 테스트 ${usd(t3)}\n\n새 프로젝트의 예상 개발 노력은 ${usd(nd)}이다. 예상 테스트 노력은?`,
   ans:usd(ans),wrongs:[usd((t1+t2+t3)/3),usd(nd*(r===0.1?0.2:0.1)),usd(nd*(r+0.05))],
   e:`평균 개발 노력 ${usd(sum/3)}, 평균 테스트 노력 ${usd((t1+t2+t3)/3)} → 비율 ${r*100}%. ${usd(nd)} × ${r*100}% = ${usd(ans)}예요.`
  };}}
];
function buildGenerated(g){
 for(let t=0;t<30;t++){
  const r=g.make();if(!r)continue;
  const o=[r.ans];r.wrongs.forEach(w=>{if(!o.includes(w))o.push(w);});
  if(o.length>=4)return {s:g.id,lo:g.lo,c:chOf(g.lo),k:g.k,q:r.q,o:o.slice(0,4),a:0,e:r.e,gen:true};
 }
 return null;
}

/* ───── 6. 문제 은행 ───── */
const Bank={
 static:RAW.map(r=>({s:r[0],k:r[1],lo:r[2],c:chOf(r[2]),q:r[3],o:r[4],a:r[5],e:r[6]})),
 pool(){return this.static.concat(GENERATORS.map(buildGenerated).filter(Boolean));},
 byId(id){return this.static.find(q=>q.s===id)||null;},
 countByLo(lo){return this.static.filter(q=>q.lo===lo).length+GENERATORS.filter(g=>g.lo===lo).length;},
 leastSeen(list,n){return shuffle(list).sort((x,y)=>(Progress.seen[x.s]||0)-(Progress.seen[y.s]||0)).slice(0,n);},
 prepare(q){
  const L=CFG.letters,p=shuffle(q.o.map((_,i)=>i)),inv={};
  p.forEach((orig,pos)=>{inv[orig]=pos;});
  return {...q,
   o:p.map(i=>q.o[i]),
   a:Array.isArray(q.a)?q.a.map(x=>inv[x]).sort((x,y)=>x-y):inv[q.a],
   e:q.e.replace(/\b([a-e])\b/g,(m,l)=>{const o=L.indexOf(l);return o<q.o.length?L[inv[o]]:m;})
  };
 }
};

/* ───── 7. 모드 설정표 ───── */
const MODES={
 easy:{label:'난이도 하',instant:true,pick:p=>Bank.leastSeen(p.filter(q=>q.k!=='K3'),10)},
 mid:{label:'난이도 중',instant:true,pick:p=>Bank.leastSeen(p.filter(q=>q.k==='K3'),6).concat(Bank.leastSeen(p.filter(q=>q.k!=='K3'),14))},
 full:{label:'실전 모의고사',instant:false,minutes:CFG.examMinutes,
  pick:p=>Object.entries(CFG.dist).flatMap(([c,n])=>Bank.leastSeen(p.filter(q=>q.c===+c),n))},
 wrong:{label:'오답 노트',instant:true,empty:'오답 노트가 비어 있어요!',
  pick:p=>Bank.leastSeen(p.filter(q=>Progress.wrong[q.s]),CFG.maxPool)},
 lo:{label:'학습목표 집중',instant:true,empty:'이 학습목표에는 아직 문제가 없어요.',
  pick:(p,lo)=>Bank.leastSeen(p.filter(q=>q.lo===lo),CFG.maxPool)}
};

/* ───── 8. 채점 ───── */
const Grade={
 isMulti:q=>Array.isArray(q.a),
 answered(q,a){return a!==undefined&&(!Array.isArray(q.a)||(Array.isArray(a)&&a.length===q.a.length));},
 isCorrect(q,a){if(!Grade.answered(q,a))return false;return Array.isArray(q.a)?q.a.every(x=>a.includes(x)):a===q.a;},
 isSelected:(a,j)=>Array.isArray(a)?a.includes(j):a===j,
 isKey:(q,j)=>Array.isArray(q.a)?q.a.includes(j):q.a===j,
 fmt(a){if(a===undefined||(Array.isArray(a)&&!a.length))return '미응답';return [].concat(a).map(x=>CFG.letters[x]).join(', ');},
 passLine:n=>Math.ceil(n*CFG.passRate)
};
function summarize(quiz){
 const n=quiz.qs.length,score=quiz.qs.filter((q,i)=>Grade.isCorrect(q,quiz.ans[i])).length,pass=Grade.passLine(n),byCh={};
 quiz.qs.forEach((q,i)=>{const b=byCh[q.c]||(byCh[q.c]={t:0,o:0});b.t++;if(Grade.isCorrect(q,quiz.ans[i]))b.o++;});
 let weak=null;
 Object.entries(byCh).forEach(([c,b])=>{const r=b.o/b.t;if(r<1&&(!weak||r<weak.r))weak={c:+c,r};});
 return {n,score,pass,ok:score>=pass,rate:score/n,byCh,weak};
}
function verdict(s){
 if(s.ok)return {head:`🎉 ${s.score}점 달성! ${s.pass}점이 합격 라인이에요`,
  sub:s.rate>=0.9?'합격이에요! 실전도 자신 있게 가도 좋아요 💪':'합격이에요! 틀린 문제만 복습하면 더 탄탄해져요.'};
 const gap=s.pass-s.score;
 return {head:`😢 ${s.score}점이에요. 합격 라인은 ${s.pass}점이에요`,
  sub:gap<=3?`아깝다! ${gap}점만 더 맞히면 합격이에요. 조금만 더 힘내요!`:`불합격이에요. ${gap}점이 더 필요해요. 좀 더 열심히 해야 해요!`};
}

/* ───── 9. 풀이 진행 ───── */
const Quiz={
 cur:null,timer:null,
 active(){return !!this.cur&&!this.cur.done;},
 label(){const c=this.cur;return c.mode==='lo'?`FL-${c.arg} 집중`:MODES[c.mode].label;},
 start(mode,arg){
  const m=MODES[mode],picked=m.pick(Bank.pool(),arg);
  if(!picked.length){alert(m.empty);return;}
  this.quit();
  this.cur={mode,arg,qs:shuffle(picked).map(q=>Bank.prepare(q)),ans:{},lock:{},i:0,
   end:m.minutes?Date.now()+m.minutes*60000:null,done:false,added:0,instant:Settings.instant&&m.instant};
  if(this.cur.end)this.timer=setInterval(()=>this.tick(),1000);
  View.quiz();window.scrollTo(0,0);
 },
 choose(j){
  const c=this.cur;if(!c||c.done||c.lock[c.i])return;
  const q=c.qs[c.i];
  if(Grade.isMulti(q)){
   let a=c.ans[c.i]||[];
   a=a.includes(j)?a.filter(x=>x!==j):a.length<q.a.length?[...a,j]:[...a.slice(1),j];
   c.ans[c.i]=a;
  }else c.ans[c.i]=j;
  if(c.instant&&Grade.answered(q,c.ans[c.i]))c.lock[c.i]=true;
  View.quiz();
 },
 move(d){const c=this.cur;c.i=Math.max(0,Math.min(c.qs.length-1,c.i+d));View.quiz();window.scrollTo(0,0);},
 jump(i){this.cur.i=i;View.quiz();},
 tick(){
  const c=this.cur;if(!c||!c.end||c.done)return;
  const left=c.end-Date.now();
  if(left<=0){this.finish(true);alert('시간이 다 됐어요! 자동으로 제출했어요.');return;}
  const el=$('timer');if(!el)return;
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;el.className=left<300000?'warn':'';
 },
 submit(){
  const c=this.cur,un=c.qs.filter((q,i)=>!Grade.answered(q,c.ans[i])).length;
  if(un&&!confirm(`아직 ${un}문항을 풀지 않았어요. 그래도 제출할까요?`))return;
  this.finish(false);
 },
 finish(timeout){
  const c=this.cur;this.stopTimer();
  if(!c.done){c.added=Progress.record(c.qs,c.ans);c.done=true;}
  View.result(timeout);
 },
 stopTimer(){if(this.timer){clearInterval(this.timer);this.timer=null;}},
 quit(){this.stopTimer();this.cur=null;}
};

const loButton=lo=>`<button class="lo" data-act="lo" data-lo="${lo}">📖 FL-${lo} ${esc(LO[lo]||'')}</button>`;

  </div>`;
  Overlay.open('modal');
 }
};
const Dict={
 cat:'전체',
 cats:['전체',...new Set(DICT.map(d=>d[0]))],
 open(){Overlay.open('dict');this.render();if(window.innerWidth>600)setTimeout(()=>$('dq').focus(),60);},
 render(){
  const kw=$('dq').value.trim(),nk=norm(kw);
  $('dchips').innerHTML=this.cats.map(c=>`<button class="tab ${c===this.cat?'on':''}" data-act="dict-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  let list=DICT.filter(d=>this.cat==='전체'||d[0]===this.cat);
  if(nk){
   const head=d=>norm(d[1]+d[2]+d[3]).includes(nk)?0:1;
   list=list.filter(d=>norm(d.join(' ')).includes(nk)).sort((x,y)=>head(x)-head(y));
  }
  $('dcount').textContent=nk?`“${kw}” 검색 결과 ${list.length}개`:`${this.cat} · ${list.length}개 용어`;
  $('dlist').innerHTML=list.length
   ?list.map(d=>`<div class="dterm"><h4>${highlight(d[1],kw)}<span class="en">${highlight(d[2],kw)}</span><span class="cat">${esc(d[0])}</span></h4>
     <p>${highlight(d[4],kw)}</p>${d[5]?`<div class="dex">예) ${highlight(d[5],kw)}</div>`:''}</div>`).join('')
   :`<div class="dempty">“${esc(kw)}”와 관련된 용어가 없어요.<br>다른 표현으로 검색해 보세요. (예: 버그 → 결함)</div>`;
  $('dlist').scrollTop=0;
 }
};

/* ───── 11. 화면 ───── */
const UI={glTab:'all',glKw:''};
const View={
 home(){
  Quiz.quit();
  const seen=Bank.static.filter(q=>Progress.seen[q.s]).length,wc=Object.keys(Progress.wrong).length;
  const card=(attrs,ic,t,d)=>`<button class="card" ${attrs}><div class="ic">${ic}</div><h3>${t}</h3><p>${d}</p></button>`;
  render(`<section class="hero"><h2>CTFL 4.0 합격 준비</h2><p>실제 시험: 40문항 · 60분 · 26점(65%) 이상 합격</p></section>
  <div class="grid">
   ${card('data-act="glossary"','📘','용어 · 실러버스','핵심 개념과 학습목표 목차')}
   ${card('data-act="start" data-mode="easy"','🌱','난이도 하','개념 문제 10개<br>7점 이상 합격')}
   ${card('data-act="start" data-mode="mid"','🔥','난이도 중','계산 포함 20개<br>13점 이상 합격')}
   ${card('data-act="start" data-mode="full"','🏆','실전 모의고사','40문항 · 60분<br>26점 이상 합격')}
   ${card('data-act="wrong-view"','📕','오답 노트',wc?`저장된 오답 ${wc}문항`:'아직 비어 있어요')}
  </div>
  <div class="box"><div class="setrow"><div><b>⚡ 즉시 채점 모드</b><p>답을 고르면 바로 정답과 해설을 보여줘요. 실전 모의고사는 항상 마지막에 채점해요.</p></div>
   <label class="sw"><input type="checkbox" data-change="instant" ${Settings.instant?'checked':''}><span></span></label></div></div>
  <div class="box small">🔁 지금까지 본 문제 <b>${seen} / ${Bank.static.length}</b> · 적게 나온 문제부터 출제돼요. 보기 순서는 매번 바뀌고, 🎲 계산 문제는 숫자가 새로 만들어져요.
   <button class="link" data-act="seen-reset">기록 초기화</button></div>
  <p class="src">문제 출처: ISTQB® CTFL v4.0 Sample Exam A(추가 문제 포함)·B·D (KSTQB 번역본) + 자동 생성 ${GENERATORS.length}종<br>해설과 용어 정의는 학습용으로 요약한 것입니다.</p>`);
 },

 glossary(){
  Quiz.quit();
  render(`<h2 style="margin:0 0 10px">📘 용어 · 실러버스</h2>
  <input class="search" id="kw" data-input="gl-search" placeholder="용어 검색 (예: 경계값, 리뷰, 리스크)" value="${esc(UI.glKw)}">
  <div class="tabs" id="gltabs"></div><div id="gl"></div>
  <button class="btn" data-act="home">← 처음으로</button>`);
  this.glossaryTabs();this.glossaryList();
 },
 glossaryTabs(){
  const tabs=[['all','전체'],['1','1장'],['2','2장'],['3','3장'],['4','4장'],['5','5장'],['6','6장'],['toc','📑 목차']];
  $('gltabs').innerHTML=tabs.map(([k,t])=>`<button class="tab ${UI.glTab===k?'on':''}" data-act="gl-tab" data-tab="${k}">${t}</button>`).join('');
 },
 glossaryList(){
  const el=$('gl'),kw=UI.glKw.trim().toLowerCase(),tab=UI.glTab;
  if(tab==='toc'&&!kw){
   let h='',last=0;
   Object.keys(LO).forEach(lo=>{
    const c=chOf(lo);if(c!==last){h+=`<h3 class="toch">${CH[c]}</h3>`;last=c;}
    const n=Bank.countByLo(lo);
    h+=`<button class="toc" data-act="lo" data-lo="${lo}"><span class="toct"><b>FL-${lo}</b> ${esc(LO[lo])}</span><span>${n?n+'문항':'—'}</span></button>`;
   });
   el.innerHTML=h;return;
  }
  const list=GL.filter(g=>(tab==='all'||tab==='toc'||chOf(g[0])===+tab)&&(!kw||(g[0]+g[1]+g[2]).toLowerCase().includes(kw)));
  el.innerHTML=list.length?list.map(termCard).join(''):'<p class="muted">검색 결과가 없어요.</p>';
 },

 wrong(){
  Quiz.quit();
  const ids=Object.keys(Progress.wrong);
  const rows=ids.map(id=>{
   const q=Bank.byId(id),g=GENERATORS.find(x=>x.id===id);
   return {id,n:Progress.wrong[id],title:q?q.q.split('\n')[0]:g?'🎲 '+g.name:id,lo:q?q.lo:g?g.lo:'',src:g?'자동 생성':'샘플 '+id};
  }).sort((x,y)=>x.lo.localeCompare(y.lo));
  render(`<h2 style="margin:0 0 6px">📕 오답 노트</h2>
  <p class="small muted" style="margin:0 0 12px">틀린 문제가 자동으로 쌓여요. 다시 풀어서 맞히면 노트에서 빠져요.</p>
  ${ids.length?`<button class="btn pri wide" data-act="start" data-mode="wrong">🔁 오답 다시 풀기 (${Math.min(ids.length,CFG.maxPool)}문항)</button>
   <div class="box">${rows.map(r=>`<div class="wn"><div>${esc(r.title.length>70?r.title.slice(0,70)+'…':r.title)}<br>
    <small>${r.lo?'FL-'+r.lo+' · ':''}${r.src} · 틀린 횟수 ${r.n}</small></div>
    <button data-act="wrong-del" data-id="${esc(r.id)}">삭제</button></div>`).join('')}</div>
   <button class="link" data-act="wrong-clear">오답 노트 비우기</button>`
  :'<div class="box">🎉 저장된 오답이 없어요. 문제를 풀면 틀린 문제가 여기에 모여요.</div>'}
  <div><button class="btn" data-act="home">← 처음으로</button></div>`);
 },

 quiz(){
  const c=Quiz.cur,q=c.qs[c.i],n=c.qs.length,a=c.ans[c.i],locked=!!c.lock[c.i],L=CFG.letters;
  const answeredCnt=c.qs.filter((x,j)=>Grade.answered(x,c.ans[j])).length;
  let pill='';
  if(c.instant){
   const lk=c.qs.filter((x,j)=>c.lock[j]).length,ok=c.qs.filter((x,j)=>c.lock[j]&&Grade.isCorrect(x,c.ans[j])).length;
   pill=`<span class="pill">✔ ${ok}/${lk}</span>`;
  }
  const optCls=j=>['opt',Grade.isSelected(a,j)&&'on',locked&&Grade.isKey(q,j)&&'ok',locked&&!Grade.isKey(q,j)&&Grade.isSelected(a,j)&&'ng'].filter(Boolean).join(' ');
  const dotCls=j=>c.instant&&c.lock[j]?(Grade.isCorrect(c.qs[j],c.ans[j])?'g':'r'):(Grade.answered(c.qs[j],c.ans[j])?'ok':'');
  const correct=Grade.isCorrect(q,a);
  const feedback=locked?`<div class="fb ${correct?'o':'x'}"><b>${correct?'⭕ 정답이에요!':`❌ 틀렸어요. 정답은 ${Grade.fmt(q.a)}예요.`}</b>
   <p>💡 ${esc(q.e)}</p>${loButton(q.lo)}</div>`:'';
  render(`<div class="qhead"><span>${esc(Quiz.label())}</span>${pill}<span>${c.i+1} / ${n}</span>${c.end?'<span id="timer"></span>':''}</div>
  <div class="bar"><div style="width:${answeredCnt/n*100}%"></div></div>
  <div class="qcard"><div class="tag">${CH[q.c]} · ${q.k}${q.gen?' · 🎲':''}</div>
   <div class="qt">${esc(q.q)}</div>${Grade.isMulti(q)&&!locked?`<p class="hint">※ 정답 ${q.a.length}개를 고르세요</p>`:''}
   <div class="opts">${q.o.map((t,j)=>`<button class="${optCls(j)}" data-act="choose" data-i="${j}" ${locked?'disabled':''}><b>${L[j]}</b><span>${esc(t)}</span></button>`).join('')}</div>
   ${feedback}</div>
  <div class="nav"><button data-act="move" data-d="-1" ${c.i?'':'disabled'}>← 이전</button>
   ${c.i===n-1?'<button class="pri" data-act="submit">제출하기</button>':'<button class="pri" data-act="move" data-d="1">다음 →</button>'}</div>
  <div class="dots">${c.qs.map((x,j)=>`<button class="dot ${j===c.i?'cur':''} ${dotCls(j)}" data-act="jump" data-i="${j}">${j+1}</button>`).join('')}</div>
  <div class="links"><button class="link" data-act="home">그만두기</button><button class="link" data-act="submit">지금 제출하기</button></div>`,{scroll:false});
  Quiz.tick();
 },

 result(timeout){
  const c=Quiz.cur,s=summarize(c),v=verdict(s);
  const rows=Object.keys(s.byCh).sort().map(ch=>{const b=s.byCh[ch],r=b.o/b.t;
   return `<div class="row"><span class="lb">${CH[ch]}</span><span class="tr"><div style="width:${r*100}%;background:var(${r>=CFG.passRate?'--g':'--r'})"></div></span><span class="v">${b.o}/${b.t}</span></div>`;}).join('');
  render(`<div class="res ${s.ok?'pass':'fail'}">${timeout?'<p>⏰ 시간 종료로 자동 제출됐어요</p>':''}
   <div class="big">${s.score} / ${s.n}</div><h2>${v.head}</h2><p>${v.sub}</p>
   ${c.mode!=='full'?`<p class="small">실제 시험(40문항) 환산: 약 ${Math.round(s.rate*40)}점 / 합격 26점</p>`:''}
   ${c.added?`<p class="small">📕 틀린 ${c.added}문항이 오답 노트에 저장됐어요.</p>`:''}</div>
  <div class="box"><h3>📊 단원별 정답률</h3>${rows}
   <p class="small" style="margin:10px 0 0">${s.weak?`👉 가장 약한 단원은 <b>${CH[s.weak.c]}</b>(정답률 ${Math.round(s.weak.r*100)}%)이에요.`:'👏 모든 단원을 다 맞혔어요!'}</p></div>
  <div class="acts">
   <button class="btn pri" data-act="start" data-mode="${c.mode}" data-arg="${esc(c.arg||'')}">🔄 새 문제로 다시 풀기</button>
   ${c.added?'<button class="btn" data-act="start" data-mode="wrong">📕 오답만 풀기</button>':''}
   ${s.weak?`<button class="btn" data-act="glossary" data-tab="${s.weak.c}">📘 ${s.weak.c}장 복습</button>`:''}
   <button class="btn" data-act="home">처음으로</button></div>
  <div class="box"><h3>📝 문제 다시 보기</h3>
   <div class="tabs"><button class="tab on" id="fw" data-act="review" data-f="wrong">틀린 문제만</button><button class="tab" id="fa" data-act="review" data-f="all">전체 보기</button></div>
   <div id="rv"></div></div>`);
  this.review(true);
 },
 review(onlyWrong){
  const c=Quiz.cur,L=CFG.letters;
  $('fw').classList.toggle('on',onlyWrong);$('fa').classList.toggle('on',!onlyWrong);
  const items=c.qs.map((q,i)=>({q,i,a:c.ans[i],ok:Grade.isCorrect(q,c.ans[i])})).filter(x=>!onlyWrong||!x.ok);
  $('rv').innerHTML=items.length?items.map(x=>`<div class="rv ${x.ok?'o':'x'}">
   <div class="tag">${x.i+1}번 · ${CH[x.q.c]} · ${x.q.k} · ${x.q.gen?'🎲 자동 생성':'샘플 '+x.q.s}</div>
   <div class="qt">${esc(x.q.q)}</div>
   <div class="small" style="margin:6px 0">${x.q.o.map((t,j)=>`<div>${L[j]}. ${esc(t)}</div>`).join('')}</div>
   <div class="ans">${x.ok?'✅':'❌'} 내 답: <b>${Grade.fmt(x.a)}</b> · 정답: <b>${Grade.fmt(x.q.a)}</b></div>
   <div class="ex">💡 ${esc(x.q.e)}</div>${loButton(x.q.lo)}</div>`).join('')
  :'<p>틀린 문제가 없어요! 🎉</p>';
 }
};

/* ───── 12. 이벤트 (모든 버튼은 data-act 하나로 처리) ───── */
const ACTIONS={
 home(){
  if(Quiz.active()&&!confirm('풀던 문제를 그만두고 처음 화면으로 갈까요?'))return;
  Overlay.closeAll();View.home();
 },
 theme:()=>Theme.toggle(),
 glossary:d=>{if(d.tab)UI.glTab=d.tab;View.glossary();},
 'gl-tab':d=>{UI.glTab=d.tab;View.glossaryTabs();View.glossaryList();},
 start:d=>{Overlay.closeAll();Quiz.start(d.mode,d.arg||undefined);},
 choose:d=>Quiz.choose(+d.i),
 move:d=>Quiz.move(+d.d),
 jump:d=>Quiz.jump(+d.i),
 submit:()=>Quiz.submit(),
 review:d=>View.review(d.f==='wrong'),
 'wrong-view':()=>View.wrong(),
 'wrong-del':d=>{Progress.removeWrong(d.id);View.wrong();},
 'wrong-clear':()=>{if(confirm('오답 노트를 모두 비울까요?')){Progress.clearWrong();View.wrong();}},
 'seen-reset':()=>{if(confirm('출제 기록을 초기화할까요?')){Progress.clearSeen();View.home();}},
 lo:d=>LOModal.open(d.lo),
 'modal-close':()=>Overlay.close('modal'),
 'dict-open':()=>Dict.open(),
 'dict-close':()=>Overlay.close('dict'),
 'dict-cat':d=>{Dict.cat=d.cat;Dict.render();}
};
document.addEventListener('click',e=>{
 const ov=e.target.closest('[data-overlay]');
 if(ov&&e.target===ov){Overlay.close(ov.id);return;}
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled)return;
 const fn=ACTIONS[el.dataset.act];
 if(fn)fn(el.dataset,e);
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.input;
 if(k==='gl-search'){UI.glKw=e.target.value;View.glossaryList();}
 else if(k==='dict-search')Dict.render();
});
document.addEventListener('change',e=>{
 if(e.target.dataset.change==='instant')Settings.setInstant(e.target.checked);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')Overlay.closeAll();});

/* ───── 13. 시작 ───── */
Theme.init();
View.home();
</script>
</body>
</html>
