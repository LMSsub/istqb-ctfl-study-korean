<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<title>ISTQB CTFL 4.0 스터디</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="hd"><button class="brand" data-act="home">📗 CTFL 4.0 스터디</button><button id="th" data-act="theme" aria-label="테마 전환">🌙</button></div></header>
<main id="app"><div class="box">불러오는 중…</div></main>

<div id="modal" class="modal" data-overlay></div>

<button class="dict-fab" id="dictFab" data-act="dict-open">📖 사전</button>
<div id="dict" class="dict" data-overlay>
 <div class="dpanel">
  <div class="dhead">
   <div class="dtop"><h3>📖 초보자 용어 사전</h3><button class="xb" data-act="dict-close" aria-label="닫기">✕</button></div>
   <input class="search" id="dq" data-input="dict-search" placeholder="용어 검색 (예: 애자일, 컨디션, 시프트, 버그)">
   <div class="dchips" id="dchips"></div>
   <div class="dcount" id="dcount"></div>
  </div>
  <div class="dlist" id="dlist"></div>
 </div>
</div>

<!-- 불러오기 실패 안내 (파일 누락·이름 오타 시) -->
<script>
(function(){
 function fail(msg){var a=document.getElementById('app');if(a&&!window.__ctflReady)a.innerHTML='<div class="box">⚠️ 앱을 불러오지 못했어요.<br>'+msg+'<br><small>js·data 폴더가 모두 올라갔는지, 파일 이름(대소문자 포함)이 맞는지 확인해 주세요.</small></div>';}
 window.addEventListener('error',function(e){fail(e.message||'파일을 찾을 수 없어요.');},true);
 setTimeout(function(){if(!window.__ctflReady)fail('시간 안에 응답이 없어요.');},8000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
