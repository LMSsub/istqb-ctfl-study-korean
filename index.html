<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ISTQB CTFL 4.0 스터디</title>
<style>
/* ═════ 테마 변수 ═════ */
:root{--p:#2f5bea;--pl:#eef2ff;--g:#16a34a;--gl:#ecfdf3;--gb:#86efac;--r:#dc2626;--rl:#fef2f2;--rb:#fca5a5;--bg:#f5f7fb;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--s:#fafafa}
[data-theme=dark]{--p:#7b96ff;--pl:#1f2650;--g:#22c55e;--gl:#0f2a1a;--gb:#166534;--r:#f87171;--rl:#2d1515;--rb:#7f1d1d;--bg:#0f1115;--c:#181b22;--t:#e5e7eb;--m:#9ca3af;--b:#2c313c;--s:#14171d}

/* ═════ 기본 ═════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--t);line-height:1.6;transition:background .2s}
body.no-scroll{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.small{font-size:13px}
.muted{color:var(--m)}

/* ═════ 헤더 ═════ */
header{background:var(--p);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.hd{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{background:none;border:none;color:#fff;font-size:17px;font-weight:700;padding:0}
#th{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:999px;width:38px;height:38px;font-size:18px}

/* ═════ 홈 ═════ */
.hero{text-align:center;margin:6px 0 20px}
.hero h2{margin:0 0 6px;font-size:23px}
.hero p{margin:0;color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;text-align:left;transition:.15s}
.card:hover{border-color:var(--p);transform:translateY(-2px)}
.card .ic{font-size:26px}
.card h3{margin:6px 0 4px;font-size:16px}
.card p{margin:0;color:var(--m);font-size:13px}
.box{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:14px 0}
.box h3{margin:0 0 10px;font-size:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setrow p{margin:2px 0 0;color:var(--m);font-size:13px}
.sw{position:relative;width:50px;height:28px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--b);border-radius:999px;transition:.2s}
.sw span:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--p)}
.sw input:checked+span:before{transform:translateX(22px)}
.src{color:var(--m);font-size:12px;text-align:center;margin-top:20px}

/* ═════ 공통 컴포넌트 ═════ */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tab{border:1px solid var(--b);background:var(--c);border-radius:999px;padding:6px 12px;font-size:13px}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
input.search{width:100%;padding:12px 14px;border:1px solid var(--b);border-radius:10px;font-size:16px;background:var(--c);color:var(--t)}
.btn{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:11px 20px;min-height:44px}
.pri{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.wide{width:100%;margin-top:10px}
.link{background:none;border:none;color:var(--m);text-decoration:underline;font-size:13px;padding:6px 0}
.links{display:flex;justify-content:space-between;margin-top:8px}
.tag{font-size:12px;color:var(--p);background:var(--pl);display:inline-block;border-radius:6px;padding:2px 8px;margin-bottom:10px}
.lo{background:var(--pl);color:var(--p);border:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;margin-top:4px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}

/* ═════ 용어집 ═════ */
.term{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.term h4{margin:0 0 4px;font-size:15px}
.term p{margin:0;font-size:14px}
.sec{font-size:11px;color:var(--p);background:var(--pl);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;border:none}
.toc{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.toc span{color:var(--m);font-size:12px;white-space:nowrap}
.toc .toct{color:var(--t);font-size:14px;white-space:normal}
.toch{margin:16px 0 8px;font-size:15px}

/* ═════ 문제 풀이 ═════ */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--m);margin-bottom:8px}
.pill{background:var(--pl);color:var(--p);border-radius:999px;padding:2px 10px;font-weight:700}
#timer{font-weight:700;color:var(--t)}
#timer.warn{color:var(--r)}
.bar{height:6px;background:var(--b);border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--p);transition:.2s}
.qcard{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}
.qt{white-space:pre-wrap;font-weight:600;margin-bottom:6px;word-break:keep-all}
.hint{color:var(--r);font-size:13px;margin:0 0 6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;text-align:left;background:var(--c);border:1.5px solid var(--b);border-radius:10px;padding:12px 14px;min-height:48px;word-break:keep-all}
.opt:hover:not(:disabled){border-color:var(--p)}
.opt.on{border-color:var(--p);background:var(--pl)}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.ng{border-color:var(--r);background:var(--rl)}
.opt:disabled{cursor:default}
.opt b{color:var(--p);min-width:14px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid}
.fb.o{background:var(--gl);border-color:var(--gb)}
.fb.x{background:var(--rl);border-color:var(--rb)}
.fb p{margin:6px 0;font-size:14px}
.nav{display:flex;gap:10px;justify-content:space-between;margin:14px 0}
.nav button{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:11px 20px;min-height:44px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--b);background:var(--c);font-size:12px}
.dot.ok{background:var(--pl);border-color:var(--p)}
.dot.cur{outline:2px solid var(--p)}
.dot.g{background:var(--gl);border-color:var(--g)}
.dot.r{background:var(--rl);border-color:var(--r)}

/* ═════ 결과 ═════ */
.res{border-radius:16px;padding:24px 18px;text-align:center;margin-bottom:14px;border:1px solid}
.res.pass{background:var(--gl);border-color:var(--gb)}
.res.fail{background:var(--rl);border-color:var(--rb)}
.res .big{font-size:44px;font-weight:800;margin:4px 0}
.res h2{margin:6px 0;font-size:19px;word-break:keep-all}
.res p{margin:4px 0}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.row .lb{width:130px;flex-shrink:0}
.row .tr{flex:1;height:8px;background:var(--b);border-radius:999px;overflow:hidden}
.row .tr div{height:100%}
.row .v{width:48px;text-align:right;color:var(--m)}
.rv{border-left:4px solid var(--b);padding:10px 12px;margin:10px 0;background:var(--s);border-radius:0 8px 8px 0}
.rv.x{border-color:var(--r)}
.rv.o{border-color:var(--g)}
.rv .qt{font-size:14px}
.rv .ans{font-size:13px;margin:6px 0}
.rv .ex{font-size:13px;background:var(--c);border-radius:8px;padding:8px 10px;margin-bottom:6px}

/* ═════ 오답 노트 ═════ */
.wn{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--b);padding:10px 0;font-size:14px}
.wn small{color:var(--m)}
.wn button{border:none;background:none;color:var(--m);font-size:13px;flex-shrink:0}

/* ═════ 학습목표 팝업 ═════ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.mbox{background:var(--bg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.mhead h3{margin:0;font-size:17px}
.xb{border:none;background:var(--c);border-radius:50%;width:36px;height:36px;font-size:16px;flex-shrink:0}
@media (min-width:641px){.modal{align-items:center}.mbox{border-radius:16px}}

/* ═════ 용어 사전 ═════ */
.dict-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:25;background:var(--p);color:#fff!important;border:none;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dict-fab:hover{filter:brightness(1.08)}
.dict{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.45);justify-content:flex-end}
.dict.show{display:flex}
.dpanel{background:var(--bg);width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;animation:dslide .2s ease}
@keyframes dslide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dhead{padding:14px 14px 10px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--b);background:var(--c)}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dtop h3{margin:0;font-size:17px}
.dchips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dchips .tab{white-space:nowrap;flex-shrink:0}
.dcount{font-size:12px;color:var(--m);margin-top:8px}
.dlist{overflow-y:auto;padding:12px 14px;padding-bottom:max(24px,env(safe-area-inset-bottom));flex:1}
.dterm{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dterm h4{margin:0;font-size:15px;line-height:1.5}
.dterm .en{font-size:12px;color:var(--m);font-weight:400;margin-left:4px}
.dterm .cat{font-size:11px;color:var(--p);background:var(--pl);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600;white-space:nowrap}
.dterm p{margin:6px 0 0;font-size:14px;word-break:keep-all}
.dterm .dex{font-size:13px;color:var(--m);margin-top:8px;padding-left:10px;border-left:3px solid var(--b);word-break:keep-all}
.dempty{text-align:center;color:var(--m);padding:40px 10px;font-size:14px}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
[data-theme=dark] mark{background:#854d0e}

/* ═════ 모바일 ═════ */
@media (max-width:600px){
 main{padding:14px 12px 30px}
 .hero h2{font-size:20px}
 .qcard{padding:14px}
 .opt{font-size:15px}
 .nav{position:sticky;bottom:0;background:var(--bg);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom));margin:10px 0;z-index:4}
 .nav button{flex:1}
 .dot{width:32px;height:32px}
 .row .lb{width:96px;font-size:12px}
 .res .big{font-size:38px}
 .dict-fab{bottom:calc(86px + env(safe-area-inset-bottom));padding:12px 15px}
 .dpanel{max-width:none}
}
</style>
</head>
<body>
<header><div class="hd"><button class="brand" data-act="home">📗 CTFL 4.0 스터디</button><button id="th" data-act="theme" aria-label="테마 전환">🌙</button></div></header>
<main id="app"></main>

<div id="modal" class="modal" data-overlay></div>

<button class="dict-fab" id="dictFab" data-act="dict-open">📖 사전</button>
<div id="dict" class="dict" data-overlay>
 <div class="dpanel">
  <div class="dhead">
   <div class="dtop"><h3>📖 초보자 용어 사전</h3><button class="xb" data-act="dict-close" aria-label="닫기">✕</button></div>
   <input class="search" id="dq" data-input="dict-search" placeholder="용어 검색 (예: 애자일, 컨디션, 시프트, 버그)">
   <div class="dchips" id="dchips"></div>
   <div class="dcount" id="dcount"></div>
  </div>
  <div class="dlist" id="dlist"></div>
 </div>
</div>

<!-- ══════════ ① 데이터 — 문제·용어·사전 ══════════ -->
<script>
const CH={1:'1장 테스팅 기초',2:'2장 SDLC와 테스팅',3:'3장 정적 테스팅',4:'4장 테스트 기법',5:'5장 테스트 관리',6:'6장 테스트 도구'};
const SEC={'1.1':'테스팅이란 무엇인가','1.2':'테스팅이 필요한 이유','1.3':'테스팅 원리','1.4':'테스트 활동, 테스트웨어, 테스트 역할','1.5':'테스팅의 필수 기술과 모범 사례','2.1':'SDLC 정황에서의 테스팅','2.2':'테스트 레벨과 테스트 유형','2.3':'유지보수 테스팅','3.1':'정적 테스팅 기초','3.2':'피드백과 리뷰 프로세스','4.1':'테스트 기법 개요','4.2':'블랙박스 테스트 기법','4.3':'화이트박스 테스트 기법','4.4':'경험 기반 테스트 기법','4.5':'협업 기반 테스트 접근법','5.1':'테스트 계획','5.2':'리스크 관리','5.3':'테스트 모니터링, 제어, 완료','5.4':'형상 관리','5.5':'결함 관리','6.1':'테스팅 지원 도구','6.2':'테스트 자동화의 이점과 리스크'};
const LO={'1.1.1':'일반적인 테스트 목적','1.1.2':'테스팅과 디버깅의 차이','1.2.1':'테스팅이 성공에 기여하는 방식','1.2.2':'테스팅과 품질 보증(QA)','1.2.3':'근본 원인, 오류, 결함, 장애','1.3.1':'7가지 테스팅 원리','1.4.1':'테스트 활동과 업무','1.4.2':'정황이 테스트 프로세스에 미치는 영향','1.4.3':'테스트 활동을 지원하는 테스트웨어','1.4.4':'추적성 유지의 가치','1.4.5':'테스팅의 역할','1.5.1':'테스팅에 필요한 일반 기술','1.5.2':'전체 팀 접근법의 장점','1.5.3':'테스팅 독립성의 장단점','2.1.1':'SDLC가 테스팅에 미치는 영향','2.1.2':'모든 SDLC에 적용되는 좋은 테스팅 사례','2.1.3':'테스트 우선 개발 접근법','2.1.4':'데브옵스가 테스팅에 미치는 영향','2.1.5':'시프트 레프트 접근법','2.1.6':'회고와 프로세스 개선','2.2.1':'테스트 레벨','2.2.2':'테스트 유형','2.2.3':'확인 테스팅과 리그레션 테스팅','2.3.1':'유지보수 테스팅과 계기','3.1.1':'정적 테스팅으로 검토 가능한 산출물','3.1.2':'정적 테스팅의 가치','3.1.3':'정적 테스팅과 동적 테스팅 비교','3.2.1':'조기·빈번한 이해관계자 피드백의 이점','3.2.2':'리뷰 프로세스 활동','3.2.3':'리뷰의 역할과 책임','3.2.4':'리뷰 유형','3.2.5':'리뷰 성공 요인','4.1.1':'블랙박스·화이트박스·경험 기반 기법 구분','4.2.1':'동등 분할','4.2.2':'경계값 분석','4.2.3':'결정 테이블 테스팅','4.2.4':'상태 전이 테스팅','4.3.1':'구문 테스팅','4.3.2':'분기 테스팅','4.3.3':'화이트박스 테스팅의 가치','4.4.1':'오류 추정','4.4.2':'탐색적 테스팅','4.4.3':'체크리스트 기반 테스팅','4.5.1':'협업 기반 사용자 스토리 작성','4.5.2':'인수 조건 작성 방법','4.5.3':'인수 테스트 주도 개발(ATDD)','5.1.1':'테스트 계획서의 목적과 내용','5.1.2':'반복·릴리스 계획에 대한 테스터의 기여','5.1.3':'시작 조건과 완료 조건','5.1.4':'추정 기법','5.1.5':'테스트 케이스 우선순위 지정','5.1.6':'테스트 피라미드','5.1.7':'테스팅 사분면','5.2.1':'리스크 발생 가능성과 영향도','5.2.2':'프로젝트 리스크와 제품 리스크','5.2.3':'제품 리스크 분석','5.2.4':'제품 리스크 제어','5.3.1':'테스팅 메트릭','5.3.2':'테스트 보고서의 목적, 내용, 대상','5.3.3':'테스팅 상태 의사소통','5.4.1':'형상 관리','5.5.1':'결함 보고서 작성','6.1.1':'테스팅 지원 도구','6.2.1':'테스트 자동화의 이점과 리스크'};
const GL=[
['1.1.1','테스트 목적','작업 산출물 평가, 장애 유발·결함 발견, 커버리지 확보, 리스크 감소, 요구사항 충족 확인(베리피케이션), 이해관계자 기대 충족 확인(벨리데이션), 정보 제공, 품질에 대한 신뢰 구축.'],
['1.1.1','베리피케이션 vs 벨리데이션','베리피케이션: 명시된 요구사항을 충족하는지 확인. 벨리데이션: 사용자·이해관계자의 실제 요구와 기대를 충족하는지 확인.'],
['1.1.2','테스팅 vs 디버깅','테스팅은 장애를 유발하거나(동적) 결함을 직접 찾는다(정적). 디버깅은 장애의 원인(결함)을 찾고 분석해 제거하는 별개 활동.'],
['1.2.1','테스팅의 성공 기여','결함을 찾아 품질을 높이고, 테스터가 SDLC 초기부터 참여하면 설계 결정을 이해하고 결함을 일찍 찾을 수 있다. 사용자 관점을 대변한다.'],
['1.2.2','QA vs QC','QA(품질 보증)는 프로세스 중심의 예방 활동. QC(품질 제어)는 제품 중심의 결함 탐지 활동이며 테스팅은 QC의 주요 형태.'],
['1.2.3','오류 · 결함 · 장애 · 근본 원인','사람이 오류(Error)를 저지르면 산출물에 결함(Defect)이 생기고, 결함이 실행되면 장애(Failure)가 발생한다. 근본 원인은 오류가 생긴 근원적 이유(시간 압박, 주의 분산 등).'],
['1.3.1','테스팅 7원리','① 결함의 존재를 보여줄 뿐 부재를 증명하지 못함 ② 완벽한 테스팅은 불가능 ③ 조기 테스팅은 시간·비용 절약 ④ 결함은 집중됨 ⑤ 테스트 효과는 줄어듦(같은 테스트 반복 시) ⑥ 테스팅은 정황에 의존 ⑦ 결함 부재의 궤변'],
['1.4.1','테스트 활동 7가지','계획 → 모니터링·제어 → 분석(무엇을: 테스트 컨디션, 우선순위) → 설계(어떻게: 테스트 케이스·커버리지 항목·차터) → 구현(절차·스위트·데이터·실행 일정·환경) → 실행 → 완료(완료 보고서·재사용 테스트웨어·교훈)'],
['1.4.1','테스트 베이시스 / 테스트 컨디션','테스트 베이시스: 분석·설계의 기준이 되는 문서·정보(요구사항 등). 테스트 컨디션: 테스트할 수 있는 측면(무엇을 테스트할지).'],
['1.4.2','정황(컨텍스트) 요소','이해관계자, 팀원의 기술·경험, 비즈니스 도메인, 기술 요소, 프로젝트 제약(범위·시간·예산·자원), 조직, SDLC, 도구. 제품 리스크와 규제 요구사항도 중요한 요소.'],
['1.4.3','활동별 테스트웨어','계획: 테스트 계획서 / 분석: 테스트 컨디션 / 설계: 테스트 케이스·커버리지 항목·테스트 차터·데이터 요구사항·환경 요구사항 / 구현: 테스트 절차·스크립트·스위트·테스트 데이터·실행 일정 / 실행: 로그·결함 보고서 / 완료: 완료 보고서·변경 요청'],
['1.4.3','커버리지 항목 / 테스트 케이스','커버리지 항목: 기법으로 도출한, 커버해야 할 대상(분할, 경계값, 전이 등). 테스트 케이스: 입력·사전조건·기대 결과·사후조건의 묶음.'],
['1.4.4','추적성','테스트 베이시스·테스트웨어·결과·결함 간의 연결. 커버리지 평가, 변경 영향도 분석(리그레션 대상 선택), 비즈니스 목표 대비 진행 측정, 잔존 리스크 평가에 쓰인다.'],
['1.4.5','테스팅 역할 vs 테스트 관리 역할','테스트 관리 역할: 계획, 모니터링·제어, 완료(완료 보고서 작성). 테스팅 역할: 분석, 설계, 구현, 실행 같은 기술적 작업.'],
['1.5.1','테스터의 일반 기술','테스팅 지식, 철저함·호기심·세부 주의력, 의사소통·경청·팀워크, 분석적·비판적 사고, 기술 지식, 도메인 지식.'],
['1.5.2','전체 팀 접근법','필요한 지식·기술을 가진 팀원 누구나 어떤 일이든 맡고 모두가 품질에 책임진다. 의사소통·협업이 좋아지고 팀 시너지가 생긴다. 테스터는 비즈니스 담당자의 인수 테스트 작성을 돕는다.'],
['1.5.3','테스팅의 독립성','장점: 다른 배경·관점·편향으로 다른 결함을 찾고, 개발자의 가정에 의문을 제기한다. 단점: 개발팀과 고립·대립, 개발자의 품질 책임감 저하, 병목으로 비난받음.'],
['2.1.1','SDLC 모델','순차(폭포수·V모델): 초기엔 정적 테스팅·테스트 계획, 동적 테스팅은 후반에. 반복·점진(애자일 등): 증분마다 정적·동적 테스팅과 잦은 리그레션 테스팅, 자동화가 중요.'],
['2.1.2','모든 SDLC의 좋은 테스팅 사례','① 모든 개발 활동에는 대응하는 테스트 활동이 있다 ② 테스트 레벨마다 구체적이고 구별되는 목적이 있다 ③ 레벨별 분석·설계는 해당 개발 단계에서 시작한다 ④ 초안이 나오는 즉시 리뷰한다'],
['2.1.3','테스트 우선 개발','코드 작성 전에 테스트를 먼저 정의. TDD(코드 지향 단위 테스트), ATDD(인수 조건으로 테스트 작성), BDD(기대 동작을 Given/When/Then으로 표현).'],
['2.1.4','데브옵스 (DevOps)','장점: 빠른 피드백·출시, 실행 가능한 소프트웨어의 지속적 가용성, 자동화 리그레션, 비기능 가시성 향상. 리스크: 배포 파이프라인·CI/CD 도구·테스트 자동화의 구축·유지보수 부담.'],
['2.1.5','시프트 레프트','테스팅을 SDLC 초기로 당기는 것. 명세 리뷰, 코드 작성 전 테스트 작성, CI, 정적 분석, 조기 비기능 테스팅 등. 초기 비용은 늘지만 전체 비용은 줄어든다.'],
['2.1.6','회고','반복주기·릴리스 끝에 잘된 점(유지할 것)과 개선할 점을 논의. 지속적인 프로세스 개선에 중요. 팀 내부 활동이며 최종 사용자는 보통 불참.'],
['2.2.1','테스트 레벨 5가지','컴포넌트(단위: 코드 논리) → 컴포넌트 통합(컴포넌트 간 인터페이스) → 시스템(전체 기능·비기능, 비즈니스 규칙) → 시스템 통합(외부 시스템) → 인수(비즈니스 요구, UAT·운영·계약·규정·알파·베타).'],
['2.2.2','테스트 유형','기능 테스팅(무엇을 하는가), 비기능 테스팅(얼마나 잘하는가: 성능·보안·사용성·유지보수성·이식성 등), 블랙박스(명세 기반), 화이트박스(구조 기반).'],
['2.2.3','확인 vs 리그레션 테스팅','확인 테스팅: 수정한 결함이 고쳐졌는지 재확인(직전 실패 → 재실행). 리그레션 테스팅: 변경으로 다른 부분에 부작용이 없는지 확인(직전 합격 → 재실행).'],
['2.3.1','유지보수 테스팅','운영 중인 시스템의 수정(수정·개선·기능 제거), 운영 환경 변경(이관·업그레이드), 단종(데이터 마이그레이션·보관)이 계기. 영향도 분석 기반 리그레션 포함.'],
['3.1.1','정적 테스팅 대상','요구사항, 소스 코드, 테스트 계획, 테스트 케이스·차터, 계약서, 사용자 스토리 등 대부분의 산출물. 사람이 해석하기 어렵고 도구로도 분석할 수 없는 것(암호화된 코드, 타사 실행 코드)은 제외.'],
['3.1.2','정적 테스팅의 가치','결함을 SDLC 초기에 찾아 수정 비용을 줄이고, 요구사항 모순·누락, 도달 불가 코드, 표준 위반처럼 동적 테스팅으로 찾기 어려운 결함을 찾는다.'],
['3.1.3','정적 vs 동적 테스팅','정적: 실행 없이 결함을 직접 찾음(도달 불가 코드, 미사용 변수, 표준 불일치, 명세 모순, 커버리지 누락). 동적: 실행해서 장애를 유발(성능, 메모리, 외부 동작). 둘 다로 찾을 수 있는 결함도 있다.'],
['3.2.1','조기·빈번한 피드백','잠재적 품질 문제를 빨리 공유하고, 요구사항 오해를 막으며, 요구사항 변경을 일찍 이해·반영하게 해준다.'],
['3.2.2','리뷰 프로세스','계획(범위·품질 특성·완료 조건) → 리뷰 착수(산출물 접근·역할 이해) → 개별 리뷰(이상 식별) → 의사소통 및 분석(이상 논의·결정) → 수정 및 보고.'],
['3.2.3','리뷰 역할','관리자(대상 결정·자원 제공), 저자, 중재자(회의 진행·안전한 환경), 서기(결정·이상 기록), 리뷰어, 리뷰 리더(전반적 책임·일정·장소 조직).'],
['3.2.4','리뷰 유형 4가지','비공식 리뷰(정의된 프로세스·공식 결과 문서 없음) → 워크쓰루(저자 주도, 품질 평가·교육·합의) → 기술 리뷰(중재자 주도, 기술적 합의·아이디어) → 인스펙션(가장 공식적, 메트릭 수집, 저자는 리더·서기 불가).'],
['3.2.5','리뷰 성공 요인','명확한 목표와 측정 가능한 완료 조건, 알맞은 리뷰 유형, 작은 단위로 나누기, 충분한 시간, 적대적 행동 삼가기, 경영진 지원, 학습 문화, 교육. 리뷰는 장애가 아니라 결함을 찾는다.'],
['4.1.1','기법 분류','블랙박스(명세 기반, 구현과 무관: EP, BVA, 결정 테이블, 상태 전이), 화이트박스(구조 기반, 구현 후 도출: 구문, 분기), 경험 기반(테스터 지식: 오류 추정, 탐색적, 체크리스트).'],
['4.2.1','동등 분할 (EP)','같은 방식으로 처리될 값끼리 분할로 나누고 각 분할에서 하나 이상 테스트. 커버리지 = 테스트한 분할 ÷ 전체 분할. 변수가 여러 개면 각 선택(each choice) 커버리지로 최소 TC 수를 계산.'],
['4.2.2','경계값 분석 (BVA)','순서 있는 분할의 경계를 테스트. 2값: 경계값 + 인접 분할의 가장 가까운 값. 3값: 각 경계값과 그 양옆 값. 예) x≤10 → 2값 10, 11 / 3값 9, 10, 11'],
['4.2.3','결정 테이블 테스팅','조건 조합과 결과를 표로 정리. 열(규칙) 하나가 커버리지 항목. 커버리지 = 실행한 열 ÷ 전체 열. 불가능한 조합, 누락, 모순을 찾는 데 유용.'],
['4.2.4','상태 전이 테스팅','상태와 이벤트에 따른 전이를 모델링. 모든 상태 커버리지, 유효 전이(0-스위치) 커버리지, 모든 전이 커버리지. 종료 상태 이후엔 전이 불가에 주의.'],
['4.3.1','구문 테스팅','구문 커버리지 = 실행된 구문 ÷ 전체 실행 가능 구문. 100%여도 모든 경로·입력 조합을 테스트한 것은 아니며, 결함 구문이 실행돼도 항상 장애가 나지는 않는다.'],
['4.3.2','분기 테스팅','분기 커버리지 = 실행된 분기(조건+무조건) ÷ 전체 분기. 100% 분기 → 100% 구문, 모든 결정 결과 실행(반대는 성립 안 함).'],
['4.3.3','화이트박스 테스팅의 가치','구현 전체를 고려하므로 명세가 모호·불완전해도 결함을 찾을 수 있고, 객관적인 커버리지 측정을 제공. 정적 테스팅에도 사용 가능. 단, 구현이 누락된 요구사항은 찾지 못한다.'],
['4.4.1','오류 추정','과거 결함과 흔한 실수에 대한 지식·경험으로 오류·결함·장애를 예상해 테스트. 결함 공격은 예상 결함·장애 목록으로 체계적으로 공격. 근본 원인은 예상 대상이 아니다.'],
['4.4.2','탐색적 테스팅','설계·실행·평가·학습을 동시에. 테스트 차터와 세션 기반. 명세가 부족하거나 시간 압박이 클 때, 숙련된 테스터일수록 효과적. 세션 중 어떤 기법이든 사용 가능.'],
['4.4.3','체크리스트 기반 테스팅','확인할 테스트 컨디션 목록으로 테스트. 항목은 구체적이고 확인 가능해야 함. 상위 수준 체크리스트는 테스터마다 다르게 수행해 커버리지가 넓어지나 재현성은 낮다.'],
['4.5.1','협업 기반 사용자 스토리','비즈니스 담당자·개발자·테스터가 함께 작성. 3C: 카드(Card), 대화(Conversation), 확인(Confirmation). 좋은 스토리는 INVEST(독립적, 협의 가능, 가치, 추정 가능, 작음, 테스트 가능).'],
['4.5.2','인수 조건','사용자 스토리가 완료됐는지 판단하는 조건. 형식: 시나리오 중심(Given/When/Then), 규칙 중심(검증 목록, 입출력 표).'],
['4.5.3','ATDD','인수 조건으로 테스트를 먼저 작성해 개발을 이끈다. 테스트는 인수 조건 범위 안에서만 도출(범위 밖 기능 테스트는 해당 스토리와 무관).'],
['5.1.1','테스트 계획','목적, 범위, 정황, 테스트 접근법(레벨·유형·기법·완료 조건), 자원, 일정, 리스크, 의사소통, 보고 방식을 정의. 테스트 케이스별 상세 데이터는 넣지 않는다.'],
['5.1.2','반복·릴리스 계획 기여','테스터는 테스트 가능한 스토리·인수 조건 작성, 리스크 식별·평가, 테스트 노력 추정, 테스트 접근법 결정에 참여한다. 스토리 우선순위는 비즈니스 담당자가 정한다.'],
['5.1.3','시작 조건 / 완료 조건','시작 조건: 자원 가용성(환경·인력·예산 승인·베이시스), 테스트웨어 준비. 완료 조건: 커버리지 달성, 결함 밀도, 미해결 결함 수, 리그레션 자동화, 예산·시간 소진.'],
['5.1.4','추정 기법','비율 기반(과거 비율 평균 적용), 외삽법(최근 추세로 예측), 와이드밴드 델파이·플래닝 포커(전문가 합의, 팀 규칙 적용 가능), 3점 추정 E=(낙관+4×최빈+비관)/6, SD=(비관−낙관)/6.'],
['5.1.5','테스트 우선순위','리스크 기반, 커버리지 기반(추가 커버리지가 큰 것부터), 요구사항 기반. 종속성이 있으면 우선순위가 낮아도 선행 TC를 먼저 실행.'],
['5.1.6','테스트 피라미드','아래층(단위)일수록 작고 빠른 테스트가 많고, 위층(E2E)일수록 크고 느린 테스트가 적다. 세분화 수준의 차이를 보여주며 자동화 구성에 도움을 준다.'],
['5.1.7','테스팅 사분면','Q1 기술·팀 지원(컴포넌트, 컴포넌트 통합) / Q2 비즈니스·팀 지원(기능, 스토리, 프로토타입) / Q3 비즈니스·제품 평가(탐색적, 사용성, UAT) / Q4 기술·제품 평가(비기능, 스모크). 이해관계자가 테스트 유형을 이해하는 데 도움.'],
['5.2.1','리스크 수준','리스크 수준 = 발생 가능성 × 영향도. 두 속성은 서로 독립적이다.'],
['5.2.2','프로젝트 리스크 vs 제품 리스크','프로젝트 리스크: 조직(지연, 인력 이동, 예산 감소), 사람(기술 부족, 부정확한 기대), 기술(범위 증가, 도구 지원 부족), 공급업체. 제품 리스크: 기능 오류, 긴 응답시간, 낮은 아키텍처 품질, 보안·안전 표준 미준수 등 품질 문제.'],
['5.2.3','제품 리스크 분석','리스크 식별 + 평가(정량·정성). 결과로 테스트 범위, 레벨·유형, 기법, 강도(상세화 수준), 우선순위를 정한다.'],
['5.2.4','제품 리스크 제어','완화(테스팅 등), 수용, 전가(보험 등), 비상 계획. 그리고 리스크 모니터링.'],
['5.3.1','테스팅 메트릭','진행, 결함(결함 수·결함 밀도·탐지율), 리스크, 커버리지, 비용 메트릭. 제품 품질 메트릭 예: MTTF(평균 고장 시간), 결함 밀도.'],
['5.3.2','테스트 보고서','진행 보고서(모니터링·제어 중)와 완료 보고서(완료 활동, 진행 보고서 활용). 진행 상황, 장애물, 메트릭, 새 리스크, 다음 계획. 대상에 맞춰 내용 조정(비즈니스 담당자에게 분기 커버리지는 불필요). 결함별 재현 절차는 결함 보고서의 몫.'],
['5.3.3','테스팅 상태 의사소통','대면 대화, 대시보드(CI/CD·번다운 차트), 메일·채팅, 온라인 문서, 공식 보고서. 위치·시간대가 다르면 대면 소통이 가장 어렵다.'],
['5.4.1','형상 관리','테스트 환경·테스트웨어 등 형상 항목의 구성·관계·버전을 식별·제어·추적. 베이스라인으로 이전 버전을 재구성해 결과를 재현할 수 있게 한다.'],
['5.5.1','결함 보고서','ID, 제목, 날짜·작성자, 테스트 대상·환경, 재현 절차(구체적 데이터 포함), 기대·실제 결과, 심각도, 우선순위, 상태, 참조. 목적: 재현·수정에 필요한 정보 제공, 추적, 프로세스 개선.'],
['6.1.1','테스트 도구 종류','관리 도구, 정적 테스팅 도구, 설계·구현 도구(데이터 준비 포함), 실행·커버리지 도구, 비기능 테스팅 도구, 데브옵스 도구, 협업 도구, 확장성·배포 표준화 도구(VM, 컨테이너).'],
['6.2.1','테스트 자동화 이점과 리스크','이점: 반복 작업 감소, 일관성·재현성, 객관적 측정(사람이 구하기 어려운 커버리지), 빠른 피드백, 실행 시간 단축. 리스크: 비현실적 기대, 비용·유지보수 노력 과소 추정, 도구 과신, 공급업체 의존, 플랫폼 비호환.']
];
const RAW=[
['A-1','K1','1.1.1','다음 설명 중 유효한 테스트 목적인 것은?',['테스트 중인 시스템에 수정되지 않은 결함이 없음을 증명하기 위해','운영 환경에 구현한 시스템에 오류가 없음을 증명하기 위해','테스트 대상의 리스크 수준을 낮추고, 품질 수준에 대한 자신감을 얻기 위해','테스트하지 않은 입력 조합이 없는지 확인하기 위해'],2,'테스팅은 결함과 장애를 찾아 리스크를 낮추고 품질에 대한 신뢰를 높여요. 결함이 없음을 증명하거나 모든 조합을 테스트하는 것은 불가능해요.'],
['A-2','K2','1.2.1','다음 중 테스트 활동이 성공에 기여하는 예를 나타내는 옵션은?',['SDLC의 다양한 활동에 테스터가 참여함으로써 작업 산출물의 결함 식별을 지원한다','개발자가 코드를 개발하는 동안 테스터가 방해하지 않도록 애씀으로써 더 좋은 코드를 작성할 수 있게 한다','최종 사용자와 협업하는 테스터는 단위 통합 및 시스템 테스팅 중 작성하는 결함 보고서의 품질을 높인다','자격증을 보유한 테스터가 자격증이 없는 테스터보다 훨씬 좋은 테스트 케이스를 작성할 것이다'],0,'테스터가 SDLC 초기부터 참여하면 설계 결정을 더 잘 이해하고 결함을 일찍 찾을 수 있어요.'],
['A-3','K2','1.3.1','당신은 새로운 시스템을 점진적으로 개발하는 팀의 테스터이다. 여러 반복주기 동안 리그레션 테스트 케이스가 바뀌지 않았고, 새로운 리그레션 결함도 식별되지 않았다. 관리자는 기뻐하지만 당신은 그렇지 못하다. 당신이 걱정하는 것을 설명하는 테스팅 원리는?',['테스트 효과는 줄어든다','결함 부재의 논리는 궤변이다','결함은 집중된다','완벽한 테스팅은 불가능하다'],0,'같은 테스트를 반복하면 결국 새 결함을 찾지 못하게 돼요. 모든 테스트가 통과한 이유가 이것일 수 있어요.'],
['A-4','K2','1.4.1','배달 주문 모바일 앱을 개발하는 팀이 현재 반복주기에서 결제 기능을 구현하기로 했다. 다음 중 테스트 분석 활동은?',['결제 서비스와의 통합을 테스트하는 데 8 M/D가 소요될 것으로 예상하는 행위','한 건의 주문에 여러 명이 각자 결제할 수 있는지 테스트해야 한다고 결정하는 행위','경계값 분석으로 최소 결제 금액 처리를 확인하는 테스트 케이스의 테스트 데이터를 도출하는 행위','신용카드 결제 테스트 케이스를 실행한 후 실제·기대 결과의 차이를 분석해 결함을 보고하는 행위'],1,'무엇을 테스트할지 정하는 것, 즉 테스트 컨디션 정의가 테스트 분석이에요. a는 계획, c는 설계, d는 실행이에요.'],
['A-5','K2','1.4.2','다음 예시 중 테스트 프로세스에 중대한 영향을 미치는 요소를 고르시오.\n\ni. 소프트웨어 개발 수명주기(SDLC)\nii. 이전 프로젝트에서 식별한 결함 수\niii. 식별한 제품 리스크\niv. 체계적인 화이트박스 테스팅을 강제하는 새로운 규제\nv. 테스트 환경 설정',['i, ii','i, iii, iv','ii, iv, v','iii, v'],1,'SDLC, 제품 리스크, 규제 요구사항은 테스트 프로세스에 큰 영향을 주는 정황 요소예요.'],
['A-6','K2','1.4.5','다음 중 주로 테스팅 역할을 하는 사람이 수행하는 작업 두 가지는?',['테스트 환경 구성','제품 백로그 유지보수','새로운 요구사항을 위한 해결방안 설계','테스트 계획 생성','테스트 베이시스 분석'],[0,4],'테스팅 역할은 분석·설계·구현·실행 같은 기술적 작업을 맡아요. 백로그는 제품 소유자, 해결방안 설계는 개발팀, 테스트 계획은 테스트 관리 역할의 일이에요.'],
['A-7','K2','1.5.1','다음 예시 중 테스터에게 가장 중요한 역량은?\n\ni. 도메인 지식 보유\nii. 제품 비전 수립 능력\niii. 좋은 팀 구성원 되기\niv. 팀이 수행하는 일의 계획 및 구성 능력\nv. 비판적 사고',['ii, iv','i, iii, v','i, ii, v','iii, iv'],1,'도메인 지식, 팀워크, 비판적 사고가 테스터의 핵심 역량이에요. 제품 비전은 비즈니스 측, 팀 계획은 테스트 관리자의 일이에요.'],
['A-8','K1','1.5.2','다음 중 전체 팀 접근법이 테스터와 비즈니스 담당자 간의 상호작용에서 나타나는 올바른 예는?',['비즈니스 담당자가 테스트 자동화 접근법을 결정한다','테스터가 비즈니스 담당자의 테스트 전략 결정을 지원한다','비즈니스 담당자는 전체 팀 접근법의 구성원이 아니다','테스터가 비즈니스 담당자의 적절한 인수 테스트 작성을 지원한다'],3,'테스터는 비즈니스 담당자와 긴밀히 협력해 적절한 인수 테스트를 만들도록 도와요.'],
['A-9','K1','2.1.2','“모든 SDLC 활동에는 그에 상응하는 테스트 활동이 있다.” 이 규칙은 어떤 SDLC 모델에 적용되는가?',['순차적 개발 모델에만','반복적 개발 모델에만','반복적, 점진적 개발 모델에만','순차적, 점진적, 반복적 개발 모델에'],3,'이 좋은 테스팅 사례는 모든 SDLC 모델에 적용돼요.'],
['A-10','K1','2.1.3','다음 중 인수 테스트 주도 개발(ATDD) 접근법을 가장 잘 설명한 것은?',['인수 조건을 일반적으로 given/when/then 형식으로 작성한다','테스트 케이스가 주로 단위 테스팅 수준에서 작성되며 코드 지향적이다','관련 소프트웨어 개발을 주도하기 위해 인수 조건을 기반으로 테스트를 작성한다','테스트가 소프트웨어의 기대 동작을 기반으로 하므로 팀원들이 더 쉽게 이해할 수 있다'],2,'ATDD는 인수 조건으로 테스트를 먼저 작성해 개발을 이끌어요. a·d는 BDD, b는 TDD 설명이에요.'],
['A-11','K2','2.1.5','다음 중 시프트 레프트 접근법의 사례가 아닌 것은?',['이해관계자가 공식적으로 승인하기 전에 사용자 요구사항 검토','관련 코드가 작성되기 전에 연관된 단위 테스트 작성','컴포넌트 테스팅을 하는 동안 컴포넌트에 대한 성능 테스트 실행','형상 관리 프로세스를 구축하기 전에 테스트 스크립트 작성'],3,'테스트 스크립트는 형상 관리 대상이라, 그 프로세스가 없는데 먼저 작성하는 것은 의미가 없어요. 나머지는 모두 시프트 레프트 사례예요.'],
['A-12','K2','2.1.6','관리자가 각 릴리스 주기가 끝날 때 회고를 주최하도록 설득하기 위한 주장 중 가장 적절한 것은?',['최근 회고의 인기가 매우 높으며 프로세스에 회고를 추가하면 고객이 좋아할 것이다','회고를 하지 않으면 최종 사용자 대표가 즉각적인 피드백을 제공할 수 없기 때문에 비용 절감에 도움이 된다','회고 과정에서 조직의 프로세스 약점을 식별해서 지속적인 프로세스 개선 작업 목록으로 사용할 수 있다','회고는 조직의 지속적인 발전에 중요한 용기와 존중 등 다섯 가지 가치가 발현될 수 있도록 한다'],2,'후속 조치가 따르는 정기 회고는 지속적인 프로세스 개선에 중요해요. 회고는 팀 내부 활동이에요.'],
['A-13','K2','2.2.1','장애 유형과 테스트 레벨을 올바르게 연결한 것은?\n\n1. 사용자의 비즈니스 요구와 다른 시스템 동작으로 인한 장애\n2. 컴포넌트 간 통신 실패로 인한 장애\n3. 코드 내 논리로 인한 장애\n4. 올바르게 구현되지 않은 비즈니스 규칙으로 인한 장애\n\nA. 단위 테스팅\nB. 단위 통합 테스팅\nC. 시스템 테스팅\nD. 인수 테스팅',['1D, 2B, 3A, 4C','1D, 2B, 3C, 4A','1B, 2A, 3D, 4C','1C, 2B, 3A, 4D'],0,'비즈니스 요구→인수(D), 컴포넌트 간 통신→단위 통합(B), 코드 논리→단위(A), 비즈니스 규칙→시스템(C).'],
['A-14','K2','2.2.3','인수 조건 AC1~AC3을 각각 TC1~TC3으로 커버한다. 세 버전에서 연속으로 세 번 실행한 결과는 다음과 같다. 식별한 결함이 모두 수정되고 새 버전이 준비되면 테스트를 다시 수행한다.\n\nTC1: (1) 실패 → (4) 합격 → (7) 합격\nTC2: (2) 합격 → (5) 실패 → (8) 합격\nTC3: (3) 실패 → (6) 실패 → (9) 합격\n\n리그레션 테스트로 수행된 테스트는?',['4, 7, 8, 9','5, 7','4, 6, 8, 9','5, 6'],1,'직전에 합격했던 테스트를 다시 실행한 것이 리그레션이에요: (5)는 (2) 합격 후, (7)은 (4) 합격 후. 직전 실패 후 재실행한 4, 6, 8, 9는 확인 테스트예요.'],
['A-15','K2','3.1.2','다음 중 정적 테스팅의 이점이 아닌 것은?',['SDLC 후반에 결함을 더 많이 식별하므로 결함 관리 비용이 적게 든다','일반적으로 정적 테스팅 중 식별한 결함을 수정하는 것이 동적 테스팅 중 식별한 결함을 수정하는 것보다 비용이 훨씬 적게 든다','동적 테스팅만으로는 식별하지 못할 수 있는 코딩 결함을 식별할 수 있다','요구사항과의 차이 및 요구사항 내 불일치를 식별할 수 있다'],0,'결함을 SDLC 후반에 찾으면 오히려 비용이 더 들어요. 정적 테스팅의 이점은 결함을 일찍 찾는 데 있어요.'],
['A-16','K1','3.2.1','다음 중 피드백을 조기에 자주 받았을 때의 이점인 것은?',['향후 프로젝트를 위해 테스트 프로세스를 개선할 수 있다','고객이 합의된 리스크에 따라 요구사항의 우선순위를 정하도록 한다','변경 사항의 품질을 측정할 수 있다','요구사항에 대한 오해를 피하는 데 도움이 된다'],3,'조기·빈번한 피드백은 잠재적 품질 문제를 일찍 공유하고 요구사항 오해를 막아줘요.'],
['A-17','K2','3.2.4','조직에서 수행하는 리뷰가 다음 특징을 가지고 있다.\n• 서기 역할을 하는 사람이 있다\n• 주요 목적은 품질을 평가하는 것이다\n• 작업 산출물 작성자가 회의를 주도한다\n• 개별 준비 단계가 있다\n• 리뷰 보고서를 작성한다\n\n사용하고 있는 리뷰 유형일 가능성이 가장 높은 것은?',['비공식 리뷰','워크쓰루','기술 리뷰','인스펙션'],1,'저자가 회의를 주도하는 것은 워크쓰루의 특징이에요. 인스펙션에서는 허용되지 않고, 서기가 있으니 비공식 리뷰도 아니에요.'],
['A-18','K1','3.2.5','다음 중 성공적인 리뷰에 기여하는 요소가 아닌 것은?',['참가자는 리뷰에 필요한 적절한 시간을 할애해야 한다','필요한 노력의 부담을 줄이기 위해 큰 작업 산출물을 작은 단위로 나눈다','참가자는 지루함, 분노, 적대감으로 비칠 수 있는 행동을 삼가야 한다','식별한 장애를 인정, 환영하고 객관적으로 처리해야 한다'],3,'리뷰는 장애가 아니라 결함을 찾아요. 그래서 d는 틀린 표현이에요.'],
['A-19','K2','4.1.1','다음 중 경험 기반 테스트 기법의 특징은?',['테스트 케이스는 상세 설계 정보를 기반으로 작성한다','인터페이스 코드에서 테스트하는 항목은 커버리지를 측정하는 데 사용한다','이 기법은 소프트웨어 및 비즈니스 도메인에 대한 테스터의 지식에 크게 의존한다','테스트 케이스는 요구사항과의 차이를 식별하기 위해 사용한다'],2,'경험 기반 기법은 테스터의 지식과 경험에 의존해요. a·b는 화이트박스, d는 블랙박스 특징이에요.'],
['A-20','K3','4.2.1','검색 옵션이 2개뿐인 아파트 검색 기능을 테스트한다.\n• 층: 지상 층, 1층, 2층 이상\n• 정원: 정원 없음, 작은 정원, 큰 정원\n\n지상 층 아파트는 모두 정원이 있고, 더 높은 층은 정원이 없다. 이 규칙을 위반한 검색은 허용되지 않는다. 각 테스트 케이스는 층과 정원 두 가지 입력을 가진다.\n\n100% 유효 동등 분할 커버리지를 달성하기 위한 최소 테스트 케이스 수는?',['3','4','5','6'],1,'작은 정원·큰 정원은 지상 층과만 조합되니 2개, 1층·2층 이상은 정원 없음과 조합되니 2개가 더 필요해서 총 4개예요.'],
['A-21','K3','4.2.2','학생의 최종 성적은 최종 점수에 따라 정해진다.\n0~50: 탈락 / 51~60: 보통 / 61~70: 만족 / 71~80: 좋음 / 81~90: 매우 좋음 / 91~100: 우수\n\n테스트 케이스의 최종 점수: TC1=91, TC2=50, TC3=81, TC4=60, TC5=70, TC6=80\n\n이 테스트 케이스로 달성한 2값 경계값 분석 커버리지는?',['50%','60%','33.3%','100%'],0,'경계값은 0, 50, 51, 60, 61, 70, 71, 80, 81, 90, 91, 100의 12개예요. 그중 91, 50, 81, 60, 70, 80의 6개를 커버해 50%예요.'],
['A-22','K3','4.2.3','자전거 대여점 고객 관리 시스템의 기능은 다음과 같다.\n• 누구나 자전거를 빌릴 수 있고, 회원은 20% 할인을 받는다\n• 단, 반납기한을 어긴 경우 할인이 적용되지 않는다\n• 15회 대여 후 회원은 티셔츠를 선물로 받는다\n\n결정 테이블(회원 / 반납기한 경과 / 15회 대여 → 결과):\nR1: T / T / F → 없음\nR2: T / F / F → 20% 할인\nR3: T / T / T → 티셔츠\nR4: T / F / T → 할인 + 티셔츠\nR5: F / T / F → 없음\nR6: F / F / F → 없음\nR7: F / T / T → 없음\nR8: F / F / T → 티셔츠\n\n기능 설명만을 기준으로, 불가능한 상황인 것은?',['R4','R2','R6','R8'],3,'티셔츠는 회원만 받을 수 있어요. 비회원인 R8에 티셔츠 결과가 있는 것은 불가능한 상황이에요.'],
['A-23','K3','4.2.4','시스템은 INIT 상태에서 시작해 OFF 상태에서 종료한다. 상태 전이는 다음과 같다.\n\nINIT --test--> DEBUG MODE\nINIT --run--> IN OPERATION\nIN OPERATION --error--> DEBUG MODE\nIN OPERATION --pause--> ON HOLD\nON HOLD --resume--> IN OPERATION\nDEBUG MODE --done--> OFF\nON HOLD --done--> OFF\n\n100% 유효 전이 커버리지를 달성하기 위한 최소 테스트 케이스 수는?',['4','2','7','3'],3,'test와 error는 한 테스트에서 함께 일어날 수 없고, 두 done도 마찬가지예요. 예: (test, done), (run, error, done), (run, pause, resume, pause, done)으로 최소 3개예요.'],
['A-24','K2','4.3.1','당신이 구성한 테스트 스위트로 100% 구문 커버리지를 달성했다. 이것은 무엇을 의미하는가?',['코드 중 결함을 가지고 있는 각 명령어가 최소 한 번은 실행됐다','더 많은 테스트 케이스를 가진 테스트 스위트는 100% 구문 커버리지를 달성하게 될 것이다','코드에 있는 모든 경로가 한 번 이상 실행됐다','입력값의 모든 조합이 적어도 한 번은 테스트됐다'],0,'100% 구문 커버리지는 모든 실행 가능한 구문(결함이 있는 구문 포함)이 최소 한 번 실행됐다는 뜻이에요.'],
['A-25','K2','4.3.3','다음 중 화이트박스 테스팅에 대한 설명으로 옳지 않은 것은?',['화이트박스 테스팅을 진행하는 동안 전체 소프트웨어 구현을 고려하게 된다','화이트박스 커버리지 측정지표는 코드 커버리지를 늘리기 위해 추가로 필요한 테스트를 식별하는 데 도움이 된다','화이트박스 테스트 기법은 정적 테스팅에 사용할 수 있다','화이트박스 테스팅은 구현된 사항이 요구사항과 어떤 차이가 있는지 식별하는 데 도움이 된다'],3,'화이트박스는 코드 구조만 보기 때문에 구현이 누락된 요구사항은 찾기 어려워요.'],
['A-26','K2','4.4.1','다음 중 오류 추정의 개념을 가장 잘 설명한 것은?',['과거 식별한 결함과 개발자가 일반적으로 하는 실수에 대해 테스터가 가진 지식과 경험을 활용한다','테스터의 개인적인 개발 경험과 개발자로서 했던 실수에 대한 경험을 활용한다','테스터가 사용자라고 상상하고 사용자가 상호작용하며 부딪힐 수 있는 오류를 추정한다','개발자가 할만한 실수를 파악하기 위해 개발 과정을 빠르게 직접 따라해 본다'],0,'오류 추정은 과거 결함과 흔한 실수에 대한 테스터의 지식·경험으로 오류·결함·장애를 예상해요.'],
['A-27','K2','4.4.2','출시가 지연되고 테스트가 늦게 시작되었지만, 당신은 매우 상세한 도메인 지식과 우수한 분석 기술을 보유하고 있다. 요구사항 전체 목록은 아직 공유되지 않았고, 관리자는 테스트 결과를 일부라도 보여달라고 한다. 이 상황에 가장 적합한 테스트 기법은?',['체크리스트 기반 테스팅','오류 추정','탐색적 테스팅','분기 테스팅'],2,'명세가 부족하고 시간 압박이 클 때, 숙련된 테스터에게는 탐색적 테스팅이 가장 유용해요.'],
['A-28','K2','4.5.2','다음 중 인수 조건을 문서화하는 방법을 가장 잘 설명한 것은?',['이해관계자의 실제 요구사항을 판단하기 위해 회고를 수행한다','사용자 스토리와 관련된 예제 테스트 컨디션을 given/when/then 형식으로 작성한다','오해할 위험을 줄이기 위해 구두로 의사소통한다','사용자 스토리 관련 리스크를 테스트 계획서에 기록한다'],1,'given/when/then은 인수 조건을 문서화하는 표준적인 방법이에요.'],
['A-29','K3','4.5.3','사용자 스토리: “편집자로서 문서가 게시되기 전에 내용을 리뷰해 문법이 정확한지 확인하려고 한다.”\n\n인수 조건:\n• 사용자는 “편집자” 역할로 문서 관리 시스템에 로그인할 수 있다\n• 편집자는 기존 문서 페이지를 볼 수 있다\n• 편집자는 페이지 내용을 편집할 수 있다\n• 편집자는 마크업 메모를 추가할 수 있다\n• 편집자는 변경 사항을 저장할 수 있다\n• 편집자는 업데이트를 위해 “문서 소유자”로 역할을 바꿀 수 있다\n\n이 사용자 스토리에 대한 ATDD 테스트의 예로 가장 적절한 것은?',['편집자가 페이지 내용을 편집한 후 문서를 저장할 수 있는지 확인하는 테스트','문서 소유자가 로그인하여 문서를 업데이트할 수 있는지 확인하는 테스트','편집자가 편집된 문서의 게시 일정을 예약할 수 있는지 확인하는 테스트','편집자가 업데이트를 위해 다른 편집자를 지정할 수 있는지 확인하는 테스트'],0,'a는 편집과 저장, 두 인수 조건을 커버해요. 나머지는 인수 조건에 없는 내용이에요.'],
['A-30','K1','5.1.2','다음 중 테스터가 반복주기 및 릴리스 계획에 기여하는 방법을 올바르게 설명한 것은?',['테스터는 개발할 사용자 스토리의 우선순위를 결정한다','테스터는 테스트할 시스템의 기능적 측면에만 집중한다','테스터는 사용자 스토리에 대한 구체적인 리스크 식별 및 평가 과정에 참여한다','테스터는 릴리스 계획 단계에서 조기 테스트 설계를 통한 고품질 소프트웨어의 출시를 보장한다'],2,'테스터는 사용자 스토리의 리스크 식별·평가에 참여해요. 우선순위는 비즈니스 담당자가 정해요.'],
['A-31','K2','5.1.3','다음 중 시스템 테스팅 완료 기준이 될 수 있는 두 가지는?',['테스트 환경 준비 상황','테스터가 테스트 대상에 로그인할 수 있는지 여부','예상 결함 밀도 도달','given/when/then 형식으로의 요구사항 변환','리그레션 테스트 자동화'],[2,4],'결함 밀도와 리그레션 자동화는 완료 조건이에요. 환경 준비, 로그인 가능 여부, 요구사항 변환은 시작 조건이에요.'],
['A-32','K3','5.1.4','팀이 3점 추정 기법으로 리스크가 높은 새 기능의 테스트 노력을 추정한다.\n• 가장 낙관적인 추정: 2M/H\n• 가장 유력한 추정: 11M/H\n• 가장 비관적인 추정: 14M/H\n\n최종 추정치는 얼마인가?',['9M/H','14M/H','11M/H','10M/H'],3,'(낙관 + 4×유력 + 비관) / 6 = (2 + 44 + 14) / 6 = 10M/H예요.'],
['A-33','K3','5.1.5','음식에 따라 근처 식당을 검색하는 앱을 테스트한다. 우선순위는 숫자가 작을수록 높다.\n\nTC001 음식 종류 선택: 우선순위 3, 종속성 없음\nTC002 음식점 선택: 우선순위 2, TC001에 종속\nTC003 경로 획득: 우선순위 1, TC002에 종속\nTC004 식당에 전화하기: 우선순위 2, TC002에 종속\nTC005 예약하기: 우선순위 3, TC002에 종속\n\n세 번째로 실행할 테스트 케이스는?',['TC003','TC005','TC002','TC001'],0,'종속성 때문에 TC001 → TC002가 먼저이고, 그다음은 우선순위가 가장 높은 TC003이에요.'],
['A-34','K2','5.1.7','테스트 유형과 애자일 테스팅 사분면을 올바르게 짝지은 것은?\n\n1. 사용성 테스팅\n2. 단위 테스팅\n3. 기능 테스팅\n4. 신뢰성 테스팅\n\nA. 1사분면: 기술 측면, 개발팀 지원\nB. 2사분면: 비즈니스 측면, 개발팀 지원\nC. 3사분면: 비즈니스 측면, 제품 평가\nD. 4사분면: 기술 측면, 제품 평가',['1C, 2A, 3B, 4D','1D, 2A, 3C, 4B','1C, 2B, 3D, 4A','1D, 2B, 3C, 4A'],0,'사용성→Q3(C), 단위→Q1(A), 기능→Q2(B), 신뢰성(비기능)→Q4(D).'],
['A-35','K2','5.2.4','리스크 분석 결과 다음 리스크가 식별되고 평가되었다.\n• 리스크: 보고서 생성에 너무 많은 시간이 걸린다\n• 발생 가능성: 중간 / 영향도: 높음\n• 대응: 시스템 테스팅 중 독립 테스트팀이 성능 효율성 테스팅을 수행하고, 릴리스 전 최종 사용자 표본으로 알파·베타 테스팅을 수행한다\n\n분석한 리스크에 대해 대응 방법으로 제안된 것은?',['리스크 수용','비상 대책','리스크 완화','리스크 전가'],2,'테스팅으로 리스크를 줄이는 것은 리스크 완화예요.'],
['A-36','K2','5.3.3','주어진 반복주기에서 완료된 작업량과 남은 총 작업량을 보여주기 위해 애자일 팀이 사용할 수 있는 작업 산출물은?',['인수 조건','결함 보고서','테스트 완료 보고서','번다운 차트'],3,'번다운 차트는 남은 시간 대비 남은 작업량을 매일 시각적으로 보여줘요.'],
['A-37','K2','5.4.1','새로운 요구사항에 맞게 자동화된 테스트 스크립트 중 하나를 업데이트해야 한다. 테스트 저장소에 새로운 버전의 테스트 스크립트를 생성하도록 하는 프로세스는?',['추적성 관리','유지보수 테스팅','형상 관리','요구공학'],2,'형상 관리는 테스트 스크립트 같은 테스트 항목의 버전을 관리해요.'],
['A-38','K3','5.5.1','개발자로부터 “재현 불가”라며 거부된 결함 보고서이다.\n\n제목: 애플리케이션 멈춤 / 2022년 5월 3일 – John Doe – 거부\n새 사용자 생성 화면의 이름 필드에 “테스트 입력값: $ä”를 입력하면 애플리케이션이 멈춘다. test_admin01 및 다른 테스트 관리자 계정으로 재로그인해도 같은 문제가 발생한다. 오류 메시지는 없고, 로그(첨부)에 치명적 오류가 있다. TC-1305에 따르면 애플리케이션은 입력값을 인식하고 사용자를 생성해야 한다. REQ-0012와 관련되므로 높은 우선순위로 수정 바란다.\n\n개발자에게 유용했을, 누락된 중요한 정보는?',['기대 결과와 실제 결과','참고자료 및 결함 상태','테스트 환경 및 테스트 항목','우선순위 및 심각도'],2,'어떤 환경에서, 어떤 애플리케이션(버전)에서 발생했는지가 빠져 있어 재현할 수 없어요.'],
['A-39','K2','6.1.1','다음 중 데이터 준비 도구가 지원하는 테스트 활동은?',['테스트 모니터링과 테스트 제어','테스트 분석과 설계','테스트 설계와 테스트 구현','테스트 완료'],2,'테스트 데이터는 실행에 필요한 테스트웨어로 테스트 구현에서 만들어요. 그래서 데이터 준비 도구가 지원하는 활동은 c예요.'],
['A-40','K1','6.2.1','다음 중 테스트 자동화 수행에 따른 잠재적 리스크를 올바르게 식별한 항목은?',['운용 과정에서 알 수 없는 리그레션이 발생할 수 있다','테스트웨어를 유지하기 위한 충분한 노력이 할당되지 않을 수 있다','테스트 도구 및 관련 테스트웨어를 충분히 신뢰할 수 없다','수동 테스팅에 할당된 시간이 줄어들 수 있다'],1,'테스트웨어 유지보수 노력을 과소 할당하는 것은 대표적인 자동화 리스크예요.'],
['A-A1','K2','1.1.2','출시할 새로운 시스템의 장애 원인을 분석하고 수정하는 작업이 주어졌다. 어떤 활동을 하고 있는 것인가?',['디버깅','소프트웨어 테스팅','요구사항 도출','결함 관리'],0,'장애의 원인을 찾고, 분석하고, 제거하는 것은 디버깅이에요.'],
['A-A2','K1','1.2.2','“많은 소프트웨어 조직에서 테스트 부서를 품질 보증(QA) 부서라고 한다.” 이 문장이 맞는지 틀리는지, 그 이유를 바르게 설명한 것은?',['맞다. 테스팅과 QA는 정확히 같은 의미이다','맞다. 둘 다 동일한 품질 문제에 집중하므로 바꿔서 사용할 수 있다','틀리다. 테스팅은 품질과 관련된 모든 활동을 포함하므로 QA보다 큰 개념이다','틀리다. QA는 품질 관련 프로세스에 중점을 두고, 테스팅은 목적 적합성 확인과 결함 식별에 중점을 둔다'],3,'QA는 프로세스 중심, 테스팅은 제품의 결함 식별 중심으로 서로 다른 개념이에요.'],
['A-A3','K2','1.2.3','옆자리에서 울린 전화가 프로그래머의 주의를 분산시켜 입력 변수의 상한을 확인하는 논리를 잘못 프로그래밍하게 했다. 나중에 시스템 테스팅에서 이 입력 필드가 유효하지 않은 값을 허용한다는 것이 발견되었다. 잘못 코딩된 상한선을 올바르게 설명한 것은?',['근본 원인','장애','오류','결함'],3,'코드 안의 잘못은 결함이에요. 주의 분산은 근본 원인, 잘못된 생각은 오류, 잘못된 값 허용은 장애예요.'],
['A-A4','K2','1.4.3','다음 테스트웨어를 작성하는 테스트 활동은?\n\n테스트 차터 #04.018 (세션 1시간)\n대상: 등록 페이지\n도구: 잘못된 값을 가진 여러 입력 데이터 세트\n목적: 등록 과정에서 잘못된 입력값을 허용하는 것과 관련된 결함 식별',['테스트 계획','테스트 모니터링과 테스트 제어','테스트 분석','테스트 설계'],3,'테스트 차터는 테스트 설계의 산출물이에요.'],
['A-A5','K2','1.4.4','다음 중 추적성이 테스팅을 어떻게 지원하는지 보여주는 가장 좋은 예는?',['변경의 영향도를 분석함으로써 테스트 완료에 대한 정보를 얻을 수 있다','테스트 케이스와 테스트 결과 간의 추적성을 분석해 잔존 리스크 수준을 추정할 수 있다','변경의 영향도 분석은 리그레션 테스팅에 적절한 테스트 케이스 선택에 도움이 된다','테스트 베이시스, 테스트 대상, 테스트 케이스 간의 추적성 분석은 테스트 데이터 선택에 도움이 된다'],2,'추적성을 통한 영향도 분석으로 리그레션에 필요한 테스트 케이스를 고를 수 있어요.'],
['A-A6','K2','1.5.3','다음 중 테스팅 독립성의 이점을 가장 잘 설명한 것은?',['독립적인 테스트팀이 있으면 결과물의 품질에 대한 책임을 테스트팀이 지도록 할 수 있다','외부 테스트팀은 납품 마감 준수 압박에 쉽게 휘둘리지 않는다','독립 테스트팀은 요구사항 변경에 산만해지지 않고, 개발자와의 소통을 결함 관리 시스템으로 제한할 수 있다','명세가 모호하면 개발자가 가정을 하게 되는데, 독립적인 테스터는 이런 가정과 해석에 의문을 제기할 수 있다'],3,'독립 테스터는 개발자의 가정과 해석에 의문을 제기할 수 있어요. 품질은 모두의 책임이고, 고립은 나쁜 관행이에요.'],
['A-A7','K2','2.1.1','V 모델을 따르는 팀의 테스터이다. SDLC 초기 단계에서 수행할 수 있는 활동은? (2개 선택)',['동적 테스트 수행','정적 테스팅','테스트 계획','인수 테스트 수행','유지보수 테스팅'],[1,2],'초기에는 실행 가능한 코드가 없으니 정적 테스팅(요구사항 리뷰)과 테스트 계획을 할 수 있어요.'],
['A-A8','K2','2.1.4','다음 중 데브옵스의 장점은?\n\ni. 빠른 제품 출시 및 짧은 출시 기간\nii. 반복적인 수동 테스팅의 필요성 증가\niii. 실행 가능한 소프트웨어의 지속적인 가용성\niv. 코드 리팩토링과 관련된 리그레션 테스트 수 감소\nv. 모든 것이 자동화되어 테스트 자동화 프레임워크 설정 비용이 저렴하다',['i, ii, iv','iii, v','i, iii','ii, iv, v'],2,'빠른 출시와 실행 가능한 소프트웨어의 지속적 가용성이 장점이에요. 수동 테스트는 줄고, 리그레션 테스트는 늘며, 자동화 구축 비용은 비싸요.'],
['A-A9','K2','2.2.2','음식 주문 앱에 “전체 주문의 95% 이상은 10초 이내에 처리되어야 한다”는 우선순위 높은 요구사항이 있다. 무작위로 주문하고 처리 시간을 측정해 요구사항과 비교하는 테스트 케이스를 만들었다. 수행한 테스트 유형은?',['비즈니스 요구사항을 다루므로 기능 테스트이다','시스템 성능을 측정하므로 비기능 테스트이다','사용자 인터페이스와 상호작용하므로 기능 테스트이다','처리 시간 측정에는 내부 구조를 알아야 하므로 화이트박스 테스트이다'],1,'얼마나 빨리 처리하는지 확인하므로 성능 효율성, 즉 비기능 테스트예요.'],
['A-A10','K2','2.3.1','조직의 테스트 전략은 시스템을 단종하려면 데이터 마이그레이션 테스트를 수행해야 한다고 명시한다. 이 테스팅은 어떤 테스트 유형에 포함해 수행할 가능성이 가장 높은가?',['유지보수 테스팅','리그레션 테스팅','신뢰성 테스팅','통합 테스팅'],0,'시스템 단종 시 데이터 마이그레이션 테스트는 유지보수 테스팅의 한 형태예요.'],
['A-A11','K1','3.1.1','다음은 SDLC 중 작성한 작업 산출물이다.\n\ni. 비즈니스 요구사항\nii. 일정 계획\niii. 테스트 예산\niv. 타사 실행 코드\nv. 사용자 스토리 및 인수 조건\n\n리뷰가 가능한 작업 산출물은?',['i, iv','i, ii, iii, iv','i, ii, iii, v','ii, iv, v'],2,'타사의 실행 가능한 코드는 리뷰할 수 없어요. 나머지는 모두 리뷰할 수 있어요.'],
['A-A12','K2','3.1.3','다음 중 정적 테스팅에 대한 올바른 설명은?\n\ni. 비정상 외부 행동을 이 테스팅으로 더 쉽게 식별할 수 있다\nii. 코딩 표준과의 불일치를 이 테스팅으로 더 쉽게 식별할 수 있다\niii. 소프트웨어 실행 시 결함으로 인한 장애를 이 테스팅으로 식별할 수 있다\niv. 이 테스팅의 목표는 가능한 빨리 결함을 식별하는 것이다\nv. 중요 보안 요구사항 중 커버되지 않은 사항을 식별·수정하기가 더 쉽다',['i, iv, v','i, iii, iv','ii, iii','ii, iv, v'],3,'표준 불일치(ii), 조기 결함 식별(iv), 커버리지 누락(v)이 정적 테스팅 설명이에요. 외부 행동과 실행 중 장애는 동적 테스팅 영역이에요.'],
['A-A13','K2','3.2.2','다음 중 공식 리뷰에 대한 설명으로 올바른 것은?',['일부 리뷰는 하나 이상의 역할이 필요하지 않다','리뷰 과정에 여러 활동이 포함된다','일부 특정 리뷰 유형을 제외하고는 리뷰 회의 전에 리뷰할 문서를 배포하지 않는다','동적 테스팅으로 식별한 사항이 아니므로 리뷰 중 발견한 결함은 보고하지 않는다'],1,'공식 리뷰 프로세스에는 계획부터 수정 및 보고까지 여러 활동이 있어요.'],
['A-A14','K1','3.2.3','다음 중 공식 리뷰에서 관리자가 수행할 수 있는 작업은?',['리뷰에 대한 전반적인 책임을 진다','리뷰 대상을 결정한다','리뷰 회의의 효과적인 진행을 보장하고, 필요한 경우 중재한다','리뷰에서 나온 결정 사항과 같은 리뷰 정보를 기록한다'],1,'관리자는 리뷰 대상을 결정하고 자원을 할당해요. a는 리뷰 리더, c는 중재자, d는 서기의 일이에요.'],
['A-A15','K3','4.2.2','와인 저장 시스템은 온도 T(°C, 가장 가까운 정수로 반올림)를 측정해 다음과 같이 알림을 준다.\n• T = 12: “최적 온도”\n• T < 12: “온도가 너무 낮습니다!”\n• T > 12: “온도가 너무 높습니다!”\n\n3값 경계값 분석으로 100% 커버리지를 달성하는 최소 테스트 입력값 세트는?',['11, 12, 13','10, 12, 14','10, 11, 12, 13, 14','10, 11, 13, 14'],2,'분할 {…11}, {12}, {13…}의 경계값은 11, 12, 13이에요. 각 경계의 양옆까지 모으면 10, 11, 12, 13, 14예요.'],
['A-A16','K2','4.3.2','다음 중 분기 테스팅에 대한 설명으로 올바른 것은?',['프로그램이 무조건 분기만 포함하면, 테스트 케이스를 실행하지 않고도 100% 분기 커버리지를 달성할 수 있다','테스트 케이스가 모든 무조건 분기를 실행하면 100% 분기 커버리지가 달성된다','100% 구문 커버리지를 달성하면 분기 커버리지도 100%이다','100% 분기 커버리지를 달성하면 모든 결정문의 모든 결정 결과가 실행된다'],3,'각 결정 결과는 조건 분기 하나에 대응하므로, 100% 분기 커버리지면 모든 결정 결과를 실행한 거예요.'],
['A-A17','K2','4.4.3','은행 계좌를 관리하는 모바일 앱을 테스트한다. 사용성을 높이기 위한 UI 모범 사례를 담은 유명한 책을 참고해 각 화면과 모든 입력 항목을 평가하는 테스트 스위트를 실행하고 있다. 이 테스트 기법의 분류로 가장 적합한 것은?',['블랙박스','탐색적','체크리스트 기반','오류 추정'],2,'UI 모범 사례 목록은 체계적으로 확인할 테스트 컨디션 목록, 즉 체크리스트예요.'],
['A-A18','K2','4.5.1','다음 중 사용자 스토리 작성을 위한 협업 접근법을 가장 잘 설명한 것은?',['테스터와 개발자가 작성한 후 비즈니스 담당자가 승인한다','비즈니스 담당자, 개발자, 테스터가 함께 작성한다','비즈니스 담당자가 작성하고 개발자와 테스터가 검증한다','독립적이고 협의 가능하며, 가치 있고, 추정 가능하며, 작고, 테스트 가능한 방식으로 작성한다'],1,'협업 기반 사용자 스토리 작성은 모든 이해관계자가 함께 쓰는 거예요. d는 INVEST 속성이에요.'],
['A-A19','K2','5.1.1','다음은 테스트 계획서의 어느 부분에 속하는가?\n\n“테스팅은 단위 테스팅과 단위 통합 테스팅을 사용해 수행한다. 규정에 따라 치명적 등급의 모든 컴포넌트는 100% 분기 커버리지 달성을 입증해야 한다.”',['의사소통','리스크 목록','테스팅 정황','테스트 접근법'],3,'테스트 레벨과 완료 조건은 테스트 접근법에 포함되는 정보예요.'],
['A-A20','K3','5.1.4','팀이 플래닝 포커로 테스트 노력을 추정한다. 합의할 시간이 없고 편차가 작으면 “가장 많은 표를 얻은 숫자를 채택한다” 규칙을 적용할 수 있다. 두 번째 라운드 후에도 합의하지 못해 세 번째 라운드를 수행했다.\n\n1라운드: 21, 2, 5, 34, 13, 8, 2\n2라운드: 13, 8, 8, 34, 13, 8, 5\n3라운드: 13, 8, 13, 13, 13, 13, 8\n\n다음 단계로 가장 적합한 것은?',['제품 소유자가 개입해 최종 결정을 내려야 한다','13이 가장 많은 표를 얻었으므로 최종 테스트 추정치로 13을 수용한다','합의에 도달했기 때문에 추가 조치는 없어도 된다','합의가 이루어지지 않았으므로 현재 릴리스에서 새 기능을 제외한다'],1,'편차가 작으니 팀 규칙대로 최다 득표인 13을 수용해요. 13과 8이 섞여 있어 완전한 합의는 아니에요.'],
['A-A21','K1','5.1.6','다음 중 테스트 피라미드에 대한 설명으로 올바른 것은?',['하위 테스트 레벨에서 훨씬 더 많은 테스트를 수행해야 한다는 것을 강조한다','각각의 하위 테스트 레벨에서 커다란 기능을 확인해야 한다고 제안한다','전체 SDLC에서 테스트 유형의 배치를 설명한다','자동화 테스트 구성에 영향을 미치지 않는다'],0,'테스트 피라미드는 하위 레벨일수록 작고 많은 테스트를 강조해요.'],
['A-A22','K1','5.2.1','리스크 분석 중 “시스템이 고객에게 너무 높은 할인을 허용할 수 있다”는 리스크의 영향도를 매우 높게 추정했다. 리스크 발생 가능성에 대해서는 어떻게 말할 수 있는가?',['영향도가 높으면 발생 가능성도 항상 높다','영향도가 높으면 발생 가능성은 항상 낮다','영향도와 발생 가능성은 독립적이므로 발생 가능성에 대해 말할 수 없다','영향도가 높으면 발생 가능성은 중요하지 않으므로 정의할 필요가 없다'],2,'리스크 영향도와 발생 가능성은 서로 독립적이에요. 리스크 수준을 구하려면 둘 다 필요해요.'],
['A-A23','K2','5.2.2','새로운 소프트웨어 제품과 관련해 식별한 리스크이다.\n\ni. 관리자가 숙련된 테스터 두 명을 다른 프로젝트로 이동시킨다\nii. 시스템이 기능 안전 표준을 준수하지 않는다\niii. 시스템 응답 시간이 사용자 요구사항보다 느리다\niv. 이해관계자의 기대치가 부정확하다\nv. 장애인이 시스템을 사용할 때 문제가 발생한다\n\n프로젝트 리스크는?',['i, iv','iv, v','i, iii','ii, v'],0,'인력 이동(i)과 부정확한 기대치(iv)는 프로젝트 리스크예요. 나머지는 제품 품질에 관한 제품 리스크예요.'],
['A-A24','K2','5.2.3','다음 중 제품 리스크 분석이 테스팅의 강도와 범위에 영향을 미치는 예는?',['테스트 관리자가 모든 리스크의 수준을 매일 모니터링하고 보고해 출시일 결정을 돕는다','“오픈소스 DB 지원 부족” 리스크 때문에 오픈소스 DB를 통합하기로 결정했다','정량적 리스크 분석에서 모든 리스크를 합친 수준을 총 잔여 리스크로 보고했다','성능 리스크 수준이 매우 높게 나와 SDLC 초기에 구체적인 성능 효율성 테스팅을 수행하기로 했다'],3,'리스크 평가 결과가 테스팅의 시기와 깊이에 영향을 준 예는 d예요. a는 리스크 모니터링 활동이에요.'],
['A-A25','K1','5.3.1','다음 중 테스트 대상의 품질 수준을 보고하는 데 많이 사용하는 지표 두 가지는?',['시스템 테스팅 중 식별한 결함 수','테스트 설계에 들어간 전체 노력을 설계된 테스트 케이스 수로 나눈 값','실행된 테스트 절차의 수','식별한 결함 수를 작업 산출물의 크기로 나눈 값','결함을 수정하는 데 필요한 시간'],[0,3],'결함 수와 결함 밀도는 테스트 대상의 품질과 관련된 지표예요. b는 효율성, e는 프로세스 지표예요.'],
['A-A26','K2','5.3.2','테스트 진행 상황 보고서에 들어가는 다음 정보 중 비즈니스 담당자에게 가장 유용하지 않은 것은?',['테스팅 진행을 방해하는 장애물','달성한 분기 커버리지','테스트 진행 상황','테스트 진행 중 나타난 새로운 리스크'],1,'분기 커버리지는 개발자와 기술 테스트 분석가가 쓰는 기술 지표예요.'],
['B-1','K2','1.2.1','다음 중 테스팅이 필요한 이유인 것은?',['동적 테스팅에서는 사용자가 절대 할 수 없는 방법으로 테스트 대상에 문제를 발생시켜 품질을 향상시킨다','정적 테스팅은 개발자가 동적 테스팅보다 더 빠른 시점에 작성한 코드에서 장애를 식별하기 위해 사용한다','정적 분석은 출력이 없는 시스템 컴포넌트가 배포 준비 완료 상태라는 증거를 고객에게 제공한다','리뷰를 통해 요구사항 명세서의 품질이 높아짐에 따라 도출되는 작업 산출물의 변경 필요성이 줄어들게 된다'],3,'리뷰로 요구사항 결함을 일찍 없애면 설계·코드 등 이후 산출물을 고칠 일이 줄어요. b는 정적 테스팅이 장애가 아니라 결함을 찾기 때문에 틀려요.'],
['B-2','K1','1.2.2','다음 중 품질 보증(QA) 및 품질 제어(QC)에 대한 설명으로 올바른 것은?',['품질 보증은 테스팅의 일부로 수행된다','구문 테스팅은 품질 제어의 일부로 수행된다','테스팅과 품질 제어는 같은 의미이다','테스팅은 품질 보증의 일부로 수행된다'],1,'테스팅(구문 테스팅 포함)은 제품 중심의 QC 활동이에요. QA는 프로세스 중심의 예방 활동이고, QC에는 테스팅 외의 기법도 있어요.'],
['B-3','K2','1.3.1','‘테스팅 원리’ 중 하나는 완벽한 테스팅은 불가능하다는 것이다. 다음 중 이 원리에 대처할 수 있는 방법은?',['명시된 모든 가능한 출력값을 커버하는 테스트 케이스 작성','가능한 모든 테스트 입력값을 문서화하고 중요도에 따라 우선순위 지정','리뷰 및 다른 정적 테스팅 접근법을 통해 가능한 한 빨리 테스팅 시작','동등 분할과 경계값 분석을 사용해 테스트 케이스 작성'],3,'모든 조합을 테스트할 수 없으니, 테스트 기법으로 유한한 부분집합을 체계적으로 골라내는 것이 대처 방법이에요. c는 조기 테스팅 원리에 해당해요.'],
['B-4','K2','1.4.1','다음 중 테스트 데이터 요구사항, 테스트 컨디션, 테스트 환경 요구사항, 테스트 케이스를 작성하는 테스트 활동은?',['테스트 설계','테스트 실행','테스트 분석','테스트 구현'],0,'테스트 설계에서 테스트 케이스, 테스트 데이터 요구사항, 테스트 환경 요구사항을 만들어요. 분석은 컨디션까지, 구현은 절차·데이터·환경 구축이에요.'],
['B-5','K2','1.4.2','다음 중 주어진 테스트 대상에 대한 테스트를 수행하는 방식에 영향을 줄 가능성이 가장 큰 것은?',['조직 마케팅팀의 평균 경험치 수준','사용자가 그들을 위해 새로운 시스템을 개발하고 있다는 것을 인지하는 것','테스트팀 구성원의 경력 연수','상용 음악 스트리밍 애플리케이션의 최종 사용자의 조직 구성'],2,'테스트팀의 역량과 경험은 테스팅 방식에 영향을 주는 대표적인 정황 요소예요.'],
['B-6','K2','1.4.4','다음 중 추적성의 가치에 대한 올바른 설명은?',['완화된 리스크와 성공한 테스트 케이스 간의 추적성은 잔존 리스크 수준을 판단할 수 있는 수단을 제공한다','사용자 요구사항과 테스트 실행 결과 간의 추적성은 비즈니스 목표 대비 프로젝트 진행 상황을 측정할 수 있는 수단을 제공한다','테스터와 실패한 테스트 케이스 간의 추적성은 테스터의 기술 수준을 판단할 수 있는 수단을 제공한다','식별된 리스크와 문서화된 테스트 컨디션 간의 추적성은 테스트할 가치가 있는 리스크를 판단하는 수단을 제공한다'],1,'요구사항과 테스트 결과를 연결하면 어떤 요구사항이 테스트됐는지 알 수 있어 비즈니스 목표 대비 진행 상황을 측정할 수 있어요.'],
['B-7','K2','1.5.1','다음 중 테스터가 보유하고 있는 보편적인 역량을 테스트하기 위해 사용하는 사례로 가장 적절한 것은?',['테스터가 가진 다양한 컴퓨터 게임 전문 지식 덕분에 게임에 관심이 많은 개발자 한 명과 원활한 관계를 구축했다','테스터가 전직 조종사이기 때문에 헬리콥터 제어 시스템의 인수 조건을 잘 이해할 수 있었다','테스터는 이전에 프로그래머로 일했으며 그 경험 덕분에 비즈니스 분석가와 잘 소통할 수 있었다','테스터는 탐색적 테스팅 세션을 시작하기 전에 테스트 케이스를 체계적으로 작성하면서 실수하지 않도록 매우 조심했다'],1,'도메인 지식은 테스터의 핵심 역량이에요. 조종사 경력 덕분에 인수 조건을 잘 이해한 사례예요.'],
['B-8','K1','1.5.2','다음 중 전체 팀 접근법의 장점은?',['팀원들은 언제든지 어떤 역할이든 수행할 수 있다','전체 개발 프로젝트 지원을 위해 하나의 팀만 있으면 된다','같은 팀에 비즈니스 대표자를 개발자와 함께 배치한다','전체 프로젝트에 도움이 되는 팀 시너지를 만들어낸다'],3,'전체 팀 접근법은 팀원의 다양한 기술을 활용해 의사소통·협업을 강화하고 팀 시너지를 만들어요.'],
['B-9','K2','2.1.1','다음 중 주어진 소프트웨어 개발 수명주기에 대한 설명으로 올바른 것은?',['애자일 소프트웨어 개발이 사용되는 경우, 시스템 테스트의 자동화는 리그레션 테스팅의 필요성을 대체한다','순차 개발 모델에서는 동적 테스팅을 일반적으로 수명주기 후반에 수행한다','반복 개발 모델에서는 단위 테스팅을 일반적으로 개발자가 수동으로 수행한다','점진적 개발 모델에서는 정적 테스팅을 초기에 수행하고 동적 테스팅을 나중에 수행한다'],1,'순차 모델은 초기에 실행 가능한 코드가 없어서 정적 테스팅을 먼저 하고, 동적 테스팅은 수명주기 후반에 해요.'],
['B-10','K1','2.1.2','다음 중 모든 소프트웨어 개발 수명주기에 적용되는 좋은 테스팅 사례인 것은?',['테스터는 이전 개발 단계의 산출물을 리뷰한다','테스터는 초안이 제공되는 즉시 작업 산출물을 리뷰한다','테스터는 테스트 분석 및 설계 시작 전에 작업 산출물을 리뷰한다','테스터는 작업 산출물이 배포된 직후 리뷰를 시작한다'],1,'초안이 나오는 즉시 리뷰해야 결함이 이후 산출물로 번지지 않아요.'],
['B-11','K1','2.1.3','다음 중 테스트 우선 개발 접근법인 것은?',['테스트 주도 개발','커버리지 주도 개발','품질 주도 개발','기능 주도 개발'],0,'TDD, ATDD, BDD가 대표적인 테스트 우선 개발 접근법이에요.'],
['B-12','K2','2.1.4','다음 중 데브옵스(DevOps)에 대한 설명으로 올바른 것은?',['릴리스 속도를 높이기 위해 지속적인 통합을 사용하고, 개발자가 단위 테스팅이 끝나지 않아도 빠르게 코드를 제출하도록 장려한다','시스템을 더 자주 업데이트하고 릴리스하려면 리그레션 위험을 줄이기 위한 많은 자동화된 리그레션 테스트가 필요하다','개발자와 운영자를 동등하게 대우하기 위해 테스터는 시프트 라이트 접근법으로 운영자의 릴리스 테스팅에 더 많은 노력을 할당한다','테스터, 개발자, 운영자 간 시너지를 높이려면 수동 테스팅 없이 완전히 자동화해야 한다'],1,'자주 릴리스하려면 리그레션 리스크를 줄이는 자동화된 리그레션 테스트가 꼭 필요해요.'],
['B-13','K2','2.2.1','다음 중 시스템 테스팅에서 수행할 가능성이 가장 높은 것은?',['독립적인 테스트팀이 진행하는 신용 관리 시스템의 보안 테스팅','환전 시스템과 외부 은행 시스템의 인터페이스에 대한 테스팅','교육운영 시스템 개발자가 진행하는 원격 학습 시스템에 대한 베타 테스팅','인적 자원 관리 시스템의 사용자 인터페이스와 데이터베이스 간의 상호작용에 대한 테스팅'],0,'시스템 테스팅은 전체 시스템의 기능·비기능(보안 등)을 확인하고, 독립 테스트팀이 하는 경우가 많아요. b는 시스템 통합, c는 인수(베타), d는 컴포넌트 통합이에요.'],
['B-14','K2','2.2.3','다음 설명 중 올바른 것은?',['프로젝트가 진행됨에 따라 리그레션 테스트는 많아지지만, 확인 테스트는 줄어든다','리그레션 테스트는 테스트 대상을 수정했을 때 작성 및 실행하고, 확인 테스트는 테스트 대상을 개선할 때마다 실행한다','리그레션 테스팅은 운영 환경이 바뀌지 않았는지 확인하는 것과 관련이 있고, 확인 테스팅은 테스트 대상의 변경 사항을 테스트하는 것과 관련이 있다','리그레션 테스팅은 변경되지 않은 코드에서 나타날 수 있는 부작용과 관련이 있고, 확인 테스팅은 변경된 코드를 테스트하는 것과 관련이 있다'],3,'리그레션 테스팅은 변경되지 않은 부분의 부작용을, 확인 테스팅은 수정한 결함이 고쳐졌는지를 확인해요.'],
['B-15','K2','3.1.3','다음 중 정적 테스팅으로 식별할 수 있지만, 동적 테스팅은 식별할 수 없는 결함은?',['사용자 인터페이스의 사용성 부족','도달할 수 없는 코드','대부분의 사용자에 대한 느린 응답 시간','필요한 기능 중 코드에 구현되지 않은 것'],1,'도달할 수 없는 코드는 리뷰·정적 분석으로 찾을 수 있지만, 동적 테스트는 실행되는 코드만 다뤄서 찾을 수 없어요.'],
['B-16','K1','3.2.1','다음 중 이해관계자의 빠르고 빈번한 피드백이 제공하는 이점은?',['생산성이 떨어지는 개발자가 누구인지 관리자가 알 수 있다','프로젝트 관리자가 이해관계자 상호작용의 우선순위를 정할 수 있다','잠재적인 품질 문제에 대한 빠른 의사소통을 촉진한다','최종 사용자가 작업 산출물 전달이 지연되는 이유를 이해하는 데 도움이 된다'],2,'이해관계자의 조기·빈번한 피드백은 잠재적 품질 문제를 빨리 공유하고 요구사항 오해를 막아줘요.'],
['B-17','K2','3.2.2','다음과 같은 업무 설명이 주어지고:\n1. 평가할 품질 특성과 완료 조건을 선택한다\n2. 모든 사람이 작업 산출물에 접근할 수 있다\n3. 작업 산출물에서 이상한 점을 식별한다\n4. 이상한 사항에 대해 논의한다\n\n리뷰 활동은 다음과 같다:\nA. 개별 리뷰\nB. 리뷰 착수\nC. 리뷰 계획\nD. 의사소통 및 분석\n\n다음 중 위의 설명과 활동을 가장 잘 연결한 것은?',['1B, 2C, 3D, 4A','1B, 2D, 3C, 4A','1C, 2A, 3B, 4D','1C, 2B, 3A, 4D'],3,'계획(품질 특성·완료 조건 선택) → 착수(산출물 접근 보장) → 개별 리뷰(이상 식별) → 의사소통 및 분석(이상 논의). 정답은 1C, 2B, 3A, 4D.'],
['B-18','K1','3.2.3','리뷰에 다음과 같은 역할이 있다:\n1. 서기\n2. 리뷰 리더\n3. 중재자\n4. 관리자\n\n리뷰에서 맡은 책임은 다음과 같다:\nA. 리뷰 회의의 효과적인 진행과 편안한 리뷰 환경을 보장한다\nB. 리뷰 회의에서 결정사항, 식별한 새로운 이상 현상과 같은 리뷰 정보를 기록한다\nC. 리뷰 대상을 결정하고 리뷰에 참여할 인력, 리뷰 시간 등 자원을 제공한다\nD. 리뷰 진행 시기, 장소 협의 등 리뷰에 대한 전반적인 책임을 진다\n\n다음 중 위의 역할과 책임을 가장 적절하게 연결한 것은?',['1A, 2B, 3D, 4C','1A, 2C, 3B, 4D','1B, 2D, 3A, 4C','1B, 2D, 3C, 4A'],2,'서기=기록(B), 리뷰 리더=전반적 책임(D), 중재자=회의 진행·안전한 환경(A), 관리자=대상 결정·자원 제공(C).'],
['B-19','K2','4.1.1','다음 중 결정 테이블 테스팅과 분기 테스팅의 차이점을 가장 잘 설명한 것은?',['결정 테이블 테스팅에서 테스트 케이스는 코드의 결정문에서 도출된다. 분기 테스팅에서 테스트 케이스는 제어 흐름에 대한 지식에서 도출된다.','결정 테이블 테스팅에서 테스트 케이스는 비즈니스 규칙을 설명하는 명세에서 도출된다. 분기 테스팅에서 테스트 케이스는 소스 코드의 잠재적 결함에 대한 예상을 기반으로 한다.','결정 테이블 테스팅에서 테스트 케이스는 제어 흐름에 대한 지식에서 도출된다. 분기 테스팅에서 테스트 케이스는 비즈니스 규칙을 설명하는 명세에서 도출된다.','결정 테이블 테스팅에서 테스트 케이스는 소프트웨어 구현 방식과 무관하다. 분기 테스팅에서 테스트 케이스는 코드를 설계하고 구현한 후에만 도출할 수 있다.'],3,'결정 테이블은 블랙박스 기법이라 구현과 무관하게 명세에서 도출해요. 분기 테스팅은 화이트박스 기법이라 코드 구조가 있어야 해요.'],
['B-20','K3','4.2.1','TestWash 세차 고객은 세차 횟수가 기록된 카드를 가지고 있다. 초기값은 0이고, 세차장에 들어오면 시스템이 횟수를 1씩 증가시킨다. 이 값(현재 세차 횟수)에 따라 할인이 결정된다.\n\n시스템은 10번 세차할 때마다 10% 할인을 1회 제공하고, 20번 세차할 때마다 40% 할인을 1회 추가로 제공한다(즉, 총 50% 할인).\n\n다음 입력 데이터 세트(현재 세차 횟수) 중 동등 분할 커버리지가 가장 높은 것은?',['19, 20, 30','11, 12, 20','1, 10, 50','10, 29, 30, 31'],0,'분할은 할인 없음 / 10% 할인(10의 배수 중 20의 배수 제외) / 50% 할인(20의 배수) 세 가지예요. 19, 20, 30이 세 분할을 모두 커버해요.'],
['B-21','K3','4.2.2','비밀번호 길이를 확인하는 입력 필드를 테스트한다. 길이는 6자 이상 12자 이하여야 하며, 그렇지 않으면 거부된다. 입력 필드는 처음에 비어 있다(길이 = 0).\n\n현재 테스트 케이스는 100% 2값 경계값 분석 커버리지를 달성했다. 리스크가 높아 100% 3값 경계값 커버리지를 달성하도록 테스트를 추가하기로 했다.\n\n추가로 테스트해야 할 비밀번호 길이는?',['4, 5, 13, 14','7, 11','1, 5, 13','1, 4, 7, 11, 14'],3,'분할 {0~5}, {6~12}, {13~}. 2값 BVA: 0, 5, 6, 12, 13. 3값 BVA: 0, 1, 4, 5, 6, 7, 11, 12, 13, 14. 추가할 값은 1, 4, 7, 11, 14예요.'],
['B-22','K3','4.2.3','다음 결정 테이블은 동맥경화증 위험 수준을 판단하는 규칙이다.\n\n규칙1: 콜레스테롤 ≤124, 혈압 ≤140 → 매우 낮음\n규칙2: 콜레스테롤 ≤124, 혈압 >140 → 낮음\n규칙3: 콜레스테롤 125~200, 혈압 ≤140 → 중간\n규칙4: 콜레스테롤 125~200, 혈압 >140 → 높음\n규칙5: 콜레스테롤 ≥201, 혈압 무관 → 매우 높음\n\nTC1: 콜레스테롤 125, 혈압 141\nTC2: 콜레스테롤 200, 혈압 201\nTC3: 콜레스테롤 124, 혈압 201\nTC4: 콜레스테롤 109, 혈압 200\nTC5: 콜레스테롤 201, 혈압 141\n\n위 테스트 케이스로 달성한 결정 테이블 커버리지는?',['40%','60%','80%','100%'],1,'TC1·TC2→규칙4, TC3·TC4→규칙2, TC5→규칙5. 5개 규칙 중 3개를 커버해 60%예요.'],
['B-23','K3','4.2.4','저장 시스템은 최대 3개의 요소를 저장할 수 있다(N = 현재 저장된 요소 수). 상태 전이는 다음과 같다.\n\nE1: START --Add / N:=1--> NOT FULL\nE2: NOT FULL --Add [N<2] / N:=N+1--> NOT FULL\nE3: NOT FULL --Remove [N>0] / N:=N-1--> NOT FULL\nE4: NOT FULL --Add [N=2] / N:=N+1--> FULL\nE5: FULL --Remove / N:=N-1--> NOT FULL\n\n이벤트 순서로 표현된 다음 테스트 케이스 중 유효 전이 커버리지가 가장 높은 것은?',['Add, Remove, Add, Add, Add','Add, Add, Add, Add, Remove, Remove','Add, Add, Add, Remove, Remove','Add, Add, Add, Remove, Add'],2,'c는 E1→E2→E4→E5→E3으로 5개 전이를 모두 지나 100%예요. a·d는 80%, b는 FULL에서 Add가 불가능해 실행할 수 없어요.'],
['B-24','K2','4.3.1','같은 코드를 대상으로 두 테스트 T1과 T2를 실행했다. T1은 40%, T2는 65% 구문 커버리지를 달성했다.\n\n다음 중 반드시 참이어야 하는 것은?',['T1과 T2로 구성된 테스트 스위트는 105%의 구문 커버리지를 달성한다','T1과 T2가 모두 실행한 명령문이 하나 이상 존재한다','테스트한 코드의 명령문 중 최소 5%가 실행되지 않는 코드이다','T1과 T2로 구성된 테스트 스위트는 100% 분기 커버리지를 달성한다'],1,'40%+65%=105%로 100%를 넘으므로, 두 테스트가 함께 실행한 구문이 최소 5%는 반드시 있어요.'],
['B-25','K2','4.3.2','분기 커버리지 계산식은 BCov = (X / Y) × 100%로 정의된다. 이 공식에서 X와 Y는 무엇인가?',['X = 실행된 결정 결과 수, Y = 전체 결정 결과 수','X = 실행된 조건 분기 수, Y = 전체 분기 수','X = 실행된 분기 수, Y = 전체 분기 수','X = 실행된 조건 분기 수, Y = 전체 결정 결과 수'],2,'분기 커버리지 = 실행된 분기 수 ÷ 전체 분기 수 × 100%. 분기에는 조건 분기와 무조건 분기가 모두 포함돼요.'],
['B-26','K2','4.4.2','다음 중 탐색적 테스팅을 선택할 근거로 가장 적절한 두 가지는?',['테스터에게 테스트 설계 및 테스트 실행을 위한 충분한 시간이 할당되지 않아서','기존 테스트 전략에서 테스터가 공식적인 블랙박스 테스트 기법을 사용하도록 하고 있어서','명세가 도구로 처리할 수 있는 공식적인 언어로 작성돼 있어서','테스터가 애자일팀의 구성원이며, 충분한 프로그래밍 기술을 가지고 있어서','테스터가 비즈니스 영역에 대한 경험이 있고, 충분한 분석 능력을 가지고 있어서'],[0,4],'탐색적 테스팅은 시간 압박이 크거나 명세가 부족할 때, 그리고 테스터가 도메인 경험과 분석력을 갖췄을 때 효과적이에요.'],
['B-27','K2','4.4.3','다음 중 체크리스트 기반 테스팅에서 사용하는 체크리스트에 포함하기 가장 적절한 것은?',['“개발자가 코드를 구현할 때 실수를 했는가?”','“달성한 구문 커버리지가 85%를 초과했는가?”','“프로그램이 기능과 비기능 요구사항에 따라 올바르게 동작하는가?”','“오류 메시지가 사용자가 이해할 수 있는 언어로 작성되는가?”'],3,'체크리스트 항목은 사람이 확인할 수 있는 구체적인 테스트 컨디션이어야 해요. a는 오류, b는 완료 조건, c는 너무 일반적이에요.'],
['B-28','K2','4.5.2','온라인 상점 운영자 관점의 사용자 스토리 인수 조건이 다음과 같다:\n\nGiven: 사용자가 로그인하고 홈페이지에 접속한 상황에서,\nWhen: “상품 추가” 버튼을 클릭하면,\nThen: “상품 입력” 페이지가 출력되고,\nAnd: 사용자는 새 상품의 이름과 가격을 입력할 수 있어야 한다.\n\n이 인수 조건은 어떤 형식으로 작성된 것인가?',['규칙 중심','시나리오 중심','제품 중심','프로세스 중심'],1,'Given/When/Then 형식은 시나리오 중심 인수 조건이에요.'],
['B-29','K3','4.5.3','팀은 인수 조건을 정의하기 위해 다음 사용자 스토리를 분석한다:\n\n“등록된 고객으로서 나는, 회사 웹사이트에서 이전 주문 내역을 보고, 나의 과거 구매 내역을 추적할 수 있기를 원한다.”\n\n다음 테스트 케이스 중 이 사용자 스토리와 관련이 없는 것은?',['고객이 로그인하고 “주문 내역 보기”를 클릭하면, 날짜·주문 번호·총 비용을 포함한 모든 이전 주문 목록이 표시된다','고객이 주문 목록에서 특정 주문을 클릭하면, 구매한 개별 품목이 가격 및 수량과 함께 표시된다','고객이 주문 내역 화면에서 “오름차순 정렬”을 클릭하면, 주문 번호 기준 오름차순으로 정렬된다','미등록 고객이 DB에 없는 유효한 이메일로 신규 등록하면, 시스템이 계정을 생성한다'],3,'신규 고객 등록은 “이전 주문 내역 보기” 스토리의 범위 밖이에요.'],
['B-30','K2','5.1.3','팀은 데브옵스 배포 파이프라인을 사용한다. 처음 세 단계는 다음과 같다:\n(1) 코드를 작성한다\n(2) 버전 관리 시스템에 코드를 제출하고 “테스트” 분기에 병합한다\n(3) 제출된 코드에 대한 단위 테스팅을 수행한다\n\n다음 중 (2)단계의 시작 조건으로 가장 적합한 것은?',['정적 분석 결과 제출된 코드에 대해 심각도가 높은 경고가 보고되지 않는다','버전 관리 시스템이 “테스트” 분기 병합 시 충돌이 없다고 보고한다','단위 테스트가 컴파일되어 실행될 준비가 되었다','구문 커버리지가 80% 이상이다'],0,'코드 제출 전에 정적 분석 결과를 확인하는 것이 (2)단계 시작 조건으로 적합해요. b는 (2)단계 이후, c·d는 (3)단계의 조건이에요.'],
['B-31','K3','5.1.4','비율 기반 추정으로 새 프로젝트의 테스트 노력을 추정하려 한다. 유사한 과거 프로젝트 데이터는 다음과 같다.\n\nP1: 개발 $800,000 / 테스트 $40,000\nP2: 개발 $1,200,000 / 테스트 $130,000\nP3: 개발 $600,000 / 테스트 $70,000\nP4: 개발 $1,000,000 / 테스트 $120,000\n\n새 프로젝트의 예상 개발 노력은 $800,000이다. 예상 테스트 노력은?',['$40,000','$80,000','$81,250','$82,500'],1,'평균 개발 $900,000, 평균 테스트 $90,000 → 비율 10%. $800,000 × 10% = $80,000.'],
['B-32','K3','5.1.5','상품 검색→상세 보기→장바구니 추가→주문 기능을 테스트한다. 우선순위(1=가장 높음)는 다음과 같다.\n\nTC1 상품 A 검색: 4\nTC2 상품 B 검색: 4\nTC3 상품 A 상세 보기: 3\nTC4 상품 B 상세 보기: 2\nTC5 상품 A 장바구니 추가: 3\nTC6 상품 B 장바구니 추가: 1\nTC7 주문하기: 5\n\n논리적 의존성: 검색 → 보기 → 추가 → 주문 순으로 먼저 테스트되어야 한다.\n\n네 번째로 실행해야 하는 테스트 케이스는?',['TC3','TC1','TC7','TC2'],1,'우선순위 1인 TC6을 가장 먼저 하려면 TC2→TC4→TC6. 다음은 A 흐름 TC1→TC3→TC5, 마지막에 TC7. 네 번째는 TC1이에요.'],
['B-33','K2','5.1.7','다음 중 테스팅 사분면 모델에서 1사분면(“기술 측면” 및 “팀 지원”)에 속하는 것은?',['사용성 테스팅','기능 테스팅','사용자 인수 테스팅','단위 통합 테스팅'],3,'Q1(기술·팀 지원)에는 컴포넌트 테스팅과 컴포넌트 통합 테스팅이 속해요. 기능 테스팅은 Q2, 사용성·UAT는 Q3예요.'],
['B-34','K2','5.2.4','다음과 같은 리스크가 있다:\n1. 비효율적인 루프 구현으로 시스템 응답이 지연됨\n2. 소비자의 선호도 변경\n3. 서버룸 침수\n4. 특정 연령 이상의 환자는 부정확한 보고서를 받음\n\n완화 활동:\nA. 리스크 수용\nB. 성능 효율성 테스팅\nC. 테스트 기법으로 경계값 분석 사용\nD. 리스크 전가\n\n가장 적절하게 연결한 것은?',['1C, 2D, 3A, 4B','1B, 2D, 3A, 4C','1B, 2A, 3D, 4C','1C, 2A, 3D, 4B'],2,'응답 지연→성능 테스팅(B), 선호도 변경→수용(A), 서버룸 침수→보험 등 전가(D), 연령 경계 오류→경계값 분석(C).'],
['B-35','K1','5.3.1','다음 중 제품 품질 지표인 것은?',['평균 고장 시간','식별된 결함 수','요구사항 커버리지','결함 탐지율'],0,'MTTF(평균 고장 시간)는 제품 품질 메트릭이에요. b·d는 결함 메트릭, c는 커버리지 메트릭이에요.'],
['B-36','K2','5.3.3','당신은 유럽 사용자를 위한 제품을 개발하는 테스트 팀의 일원이다. 팀은 북미에 있으며 애자일·데브옵스와 CI/CD 파이프라인을 사용한다.\n\n고객에게 테스트 진행 상황을 전달하는 효과가 가장 낮은 방법은?',['면대면','대시보드','이메일','화상회의'],0,'고객(유럽)과 팀(북미)의 위치와 시차 때문에 면대면 소통이 가장 어려워요.'],
['B-37','K2','5.4.1','다음 중 형상관리가 테스팅을 지원하는 방법을 가장 잘 설명한 것은?',['환경의 버전을 알고 있기 때문에, 형상관리 도구에서 해당 환경에 사용된 라이브러리, 스텁, 드라이버의 버전을 알아낼 수 있다','테스트 입력값 기록을 가지고 있기 때문에, 형상관리 도구는 테스트 케이스를 실행하고 커버리지를 계산할 수 있다','라이센스 구매일 데이터를 가지고 있기 때문에, 형상관리 도구는 라이센스 종료 정보를 자동으로 생성할 수 있다','테스트 케이스의 버전을 알고 있기 때문에, 형상관리 도구는 테스트 데이터를 자동으로 생성할 수 있다'],0,'형상 관리는 테스트 환경 같은 복잡한 형상 항목의 구성 요소, 관계, 버전을 기록해요.'],
['B-38','K3','5.5.1','숫자를 오름차순으로 정렬하는 함수를 테스트했다. 실행 로그는 다음과 같다.\n\nTC1 입력: 3 → 출력: 3 (통과)\nTC2 입력: 3 11 6 5 → 출력: 3 5 6 11 (통과)\nTC3 입력: 8 7 3 7 1 → 출력: 1 3 7 8 (실패)\nTC4 입력: -2 -2 -2 -3 -3 → 출력: -3 -2 (실패)\nTC5 입력: 0 -2 0 3 4 4 → 출력: -2 0 3 4 (실패)\n\n결함 보고서에 쓸 실패 설명으로 가장 좋은 것은?',['시스템이 여러 숫자 세트를 정렬하지 못했다. 참조: TC3, TC4, TC5','시스템이 정렬 시 중복 항목을 무시하는 것 같다. 참조: TC3, TC4, TC5','시스템이 음수를 정렬하지 못한다. 참조: TC4, TC5','TC3, TC4, TC5에 결함(입력 데이터 중복)이 있으므로 수정해야 한다'],1,'실패한 TC 모두 입력에 중복값이 있고 출력에서 중복이 사라졌어요. 개발자가 원인을 빨리 찾게 돕는 구체적인 설명은 b예요.'],
['B-39','K2','6.1.1','도구 설명:\n1. 작업 흐름 추적 지원\n2. 의사소통 촉진\n3. 가상 머신\n4. 리뷰 지원\n\n도구 분류:\nA. 정적 테스팅 도구\nB. 확장성 및 배포 표준화 지원 도구\nC. 데브옵스 도구\nD. 협업 도구\n\n가장 적절하게 연결한 것은?',['1A, 2B, 3C, 4D','1B, 2D, 3C, 4A','1C, 2D, 3B, 4A','1D, 2C, 3A, 4B'],2,'작업 흐름 추적→데브옵스(C), 의사소통→협업(D), 가상 머신→확장성·배포 표준화(B), 리뷰 지원→정적 테스팅(A).'],
['B-40','K1','6.2.1','다음 중 테스트 자동화의 이점으로 가장 적절한 것은?',['사람이 도출하기에는 너무 복잡한 커버리지 측정치를 제공해준다','테스팅에 대한 책임을 도구 공급업체와 공유하게 한다','테스트 결과 분석 시 비판적 사고를 하지 않아도 되게 한다','프로그램 코드를 분석해서 테스트 케이스를 작성한다'],0,'자동화는 사람이 계산하기 어려운 커버리지 측정치를 제공해요. 나머지는 이점이 아니에요.'],
['D-1','K1','1.1.1','다음 중 테스트의 일반적인 목적으로 맞는 것은?',['테스트 대상의 결함 식별 및 수정','개발자와 효과적인 커뮤니케이션 유지','법적 요구사항 충족을 확인하는 벨리데이션','테스트 대상의 품질에 대한 자신감 확보'],3,'품질에 대한 신뢰 구축은 테스트 목적이에요. 결함 수정은 테스팅 활동이 아니고, 법적 요구사항 확인은 베리피케이션이에요.'],
['D-2','K2','1.2.3','장애인 사용자를 고려하지 않은 UI가 설계되었다(설계자가 피곤했던 것으로 보인다). 개발자는 설계대로 UI를 구현했지만, 엄청난 시간적 압박 때문에 보너스 계산 코드에 적절한 예외 처리를 넣지 않았다. 배포 후 장애인 사용자 일부가 불만을 제기했고, 규제 당국이 회사에 벌금을 부과했다. 보너스 계산이 때때로 부정확하다는 사실은 아직 아무도 모른다.\n\n다음 중 올바른 설명은?',['보너스 계산 오류는 가끔 발생하는 결함이다','장애인 사용자에 대처하지 못해 받은 벌금은 장애이다','엄청난 시간적 압박 속에서 일하는 프로그래머는 근본 원인이다','사용자 인터페이스 설계에 설계자 오류가 포함되어 있다'],2,'시간 압박이 프로그래머의 실수를 낳았고, 이것이 결함의 근본 원인이에요. 보너스 계산 오류는 장애이고, UI 설계에 들어 있는 것은 오류가 아니라 결함이에요.'],
['D-3','K2','1.3.1','테스터가 테스트 컨디션을 사용해 테스트 케이스를 작성하고 실행한다. 테스트 컨디션은 같지만 테스트 케이스는 매번 달라진다. 이렇게 테스트 케이스를 바꿈으로써 다루고 있는 테스팅 원리는?',['테스트 효과는 줄어든다','결함 부재는 궤변이다','조기 테스팅으로 시간과 비용을 절약할 수 있다','결함은 집중된다'],0,'같은 테스트를 반복하면 새 결함을 찾기 어려워지니, 매번 다른 테스트 케이스를 만들어 효과가 줄어드는 것을 막는 거예요.'],
['D-4','K2','1.4.1','테스트 업무:\n1. 테스트 컨디션에서 테스트 케이스 도출\n2. 재사용 가능한 테스트웨어 식별\n3. 테스트 케이스를 테스트 절차로 구성\n4. 테스트 베이시스 및 테스트 대상 평가\n\n테스트 활동:\nA. 테스트 분석\nB. 테스트 설계\nC. 테스트 구현\nD. 테스트 완료\n\n업무와 활동을 가장 적절하게 연결한 것은?',['1B, 2A, 3D, 4C','1B, 2D, 3C, 4A','1C, 2A, 3B, 4D','1C, 2D, 3A, 4B'],1,'TC 도출→설계(B), 재사용 테스트웨어 식별→완료(D), 테스트 절차 구성→구현(C), 베이시스·대상 평가→분석(A).'],
['D-5','K2','1.4.3','다음과 같은 테스트웨어가 있다.\n\ni. 테스트 완료 보고서\nii. 테스트 입력과 기대 결과 데이터가 저장된 데이터베이스\niii. 테스트 환경 구축에 필요한 구성요소 목록\niv. 실행 순서대로 문서화된 테스트 케이스 시퀀스\nv. 테스트 케이스\n\n테스트 구현의 결과로 작성되는 테스트웨어는?',['ii, iv','iii, v','i, ii, v','i, iii, iv'],0,'테스트 데이터(ii)와 테스트 절차(iv)는 구현의 산출물이에요. 환경 요구사항(iii)과 테스트 케이스(v)는 설계, 완료 보고서(i)는 완료의 산출물이에요.'],
['D-6','K2','1.4.5','다음 중 테스트 관리 역할을 맡은 사람이 수행하는 작업을 가장 적절하게 설명하는 것은?',['테스트 베이시스와 테스트 대상 평가','테스트 환경 요구사항 정의','테스트 대상의 테스트 용이성 평가','테스트 완료 보고서 작성'],3,'테스트 관리 역할은 계획, 모니터링·제어, 완료를 맡아요. 나머지는 분석·설계에 속하는 테스팅 역할의 일이에요.'],
['D-7','K1','1.5.2','다음 중 전체 팀 접근법의 장점인 것은?',['팀원 간 의사소통 개선','개인의 품질에 대한 책임감 감소','최종 사용자에게 결과물을 더 빠르게 배포','외부 비즈니스 사용자와의 협업 감소'],0,'전체 팀 접근법은 팀원 간 활발한 의사소통과 협업을 장려해요.'],
['D-8','K2','1.5.3','테스팅 독립성의 장단점이 다음과 같다.\n\ni. 테스터가 개발자와 다른 장소에서 작업한다\nii. 테스터는 개발자가 코드를 작성하면서 수립한 가정에 의문을 제기한다\niii. 테스터와 개발자 사이에 대립적인 관계가 형성되었다\niv. 개발자는 품질에 대한 대부분의 책임이 테스터에게 있다고 믿게 되었다\nv. 테스터와 개발자는 서로 다른 편향을 가지고 있다\n\n장점에 해당하는 것은?',['i, iv','ii, v','i, iii, iv','ii, iii, v'],1,'가정에 의문 제기(ii)와 다른 편향(v)이 독립성의 장점이에요. 격리, 대립, 책임 전가는 단점이에요.'],
['D-9','K1','2.1.2','다음 중 모든 소프트웨어 개발 수명주기에 적용할 수 있는 좋은 테스팅 방법은?',['각 테스트 레벨은 구체적이고 명확한 테스트 목적을 가진다','특정 테스트 레벨의 테스트 구현과 실행은 연관된 개발 단계에서 시작한다','테스터는 관련 작업 산출물의 초안이 작성되는 즉시 테스트 설계를 시작한다','모든 동적 테스팅 활동은 상응하는 정적 테스팅 활동을 가진다'],0,'테스트 레벨마다 구별되는 목적이 있어야 불필요한 중복이 없어요. 해당 개발 단계에서 시작하는 것은 분석·설계이고, 설계는 초안이 아닌 합의된 베이시스로 해야 해요.'],
['D-10','K1','2.1.3','다음 중 테스트 우선 개발 접근법은?',['행위 주도 개발','테스트 레벨 주도 개발','기능 주도 개발','성능 주도 개발'],0,'BDD(행위 주도 개발)는 대표적인 테스트 우선 접근법이에요.'],
['D-11','K2','2.1.4','다음 중 데브옵스를 구축할 때 생길 수 있는 문제일 가능성이 가장 높은 것은?',['비기능적 품질 특성을 간과하지 않도록 확인하는 문제','지속적으로 변화하는 테스트 환경을 관리하는 문제','적절한 경험을 갖춘 수동 테스터를 확보하는 문제','배포 파이프라인에 테스트 자동화를 구축하는 문제'],3,'배포 파이프라인과 테스트 자동화의 구축·유지보수는 데브옵스의 대표적인 난제예요.'],
['D-12','K2','2.1.6','다음 중 회고를 가장 적절하게 설명하고 있는 것은?',['품질 달성에 완전히 기여하지 않은 다른 팀원을 식별할 수 있다','성공적이었던 활동을 식별할 기회를 제공해 향후 개선이 생길 때도 이를 유지하도록 한다','관리자나 고객에 대한 우려사항을 비난받지 않는 환경에서 표명할 수 있는 기회이다','다음 반복주기의 계획 및 기술적 결정 사항에 초점을 맞춰 논의하는 자리이다'],1,'회고는 성공적이어서 유지할 것과 개선할 점을 논의해요. 다음 반복 계획은 반복 계획 회의에서 해요.'],
['D-13','K2','2.2.2','다음 중 기능 테스팅에서 수행할 가능성이 가장 높은 테스트는?',['정렬 기능이 목록 및 배열의 요소를 오름차순으로 정렬하는지 확인하는 테스트','정렬 기능이 시작 후 1초 이내로 완료되는지 확인하는 테스트','정렬을 오름차순에서 내림차순으로 바꾸는 것이 얼마나 용이한지 확인하는 테스트','32비트에서 64비트 환경으로 이동해도 정렬 기능이 올바르게 동작하는지 확인하는 테스트'],0,'올바르게 정렬하는지(무엇을 하는가)가 기능 테스트예요. b는 성능, c는 유지보수성, d는 이식성으로 모두 비기능이에요.'],
['D-14','K2','2.3.1','다음 중 환전 시스템의 유지보수 테스팅을 유발하는 요인이 될 가능성이 가장 큰 것은?',['개발자가 시스템을 바꾸기 어렵다고 보고해 테스터가 사실인지 확인하기로 했다','환불 기능이 고객에게 정확한 금액을 지급하지 않는 경우가 있어 제거했다','애자일 팀이 새로운 고객 포인트 기능을 추가하는 사용자 스토리의 개발을 시작했다','통화 거래 기능이 영어와 현지 언어 모두 지원하도록 재구성되었다'],1,'운영 중인 시스템의 수정(기능 제거)은 유지보수 테스팅의 계기예요. a는 유지보수성 테스팅, c는 새 기능 개발이에요.'],
['D-15','K1','3.1.1','다음 중 정적 테스팅의 대상이 아닌 것은?',['계약서','테스트 계획서','암호화된 코드','테스트 차터'],2,'암호화된 코드는 사람이 해석하기 어렵고 도구로도 분석할 수 없어 정적 테스팅에 적합하지 않아요.'],
['D-16','K2','3.1.2','다음 중 정적 테스팅의 가치에 대한 설명으로 올바른 것은?',['정적 테스팅으로 식별할 수 있는 결함 유형은 동적 테스팅으로 찾을 수 있는 결함 유형과 다르다','동적 테스팅은 정적 테스팅으로 식별할 수 있는 결함과 일부 추가 결함 유형을 식별할 수 있다','동적 테스팅은 정적 테스팅으로 식별할 수 있는 일부 결함을 식별할 수 있지만 모든 결함을 식별할 수는 없다','정적 테스팅은 동적 테스팅으로 식별할 수 있는 결함 유형뿐 아니라 추가적인 결함 유형도 식별할 수 있다'],2,'정적 전용, 동적 전용, 둘 다 가능한 결함 유형이 있어요. 그래서 동적 테스팅은 정적 테스팅이 찾는 결함 중 일부만 찾을 수 있어요.'],
['D-17','K2','3.2.2','다음과 같은 리뷰 활동이 있다.\n\n1. 감지된 이상현상에 대해 논의하고 상태, 소유권, 추가 조치를 결정한다\n2. 이슈를 기록하고, 작업 산출물을 승인하기 전에 필요한 업데이트를 처리한다\n3. 리뷰어는 건의사항과 질문을 도출하고 이상현상을 식별하기 위해 각종 기법을 활용한다\n4. 집중적이고 효율적인 리뷰를 위해 리뷰의 목적과 일정을 설정한다\n5. 리뷰 대상 항목에 대한 접근 권한을 참가자에게 제공한다\n\n리뷰 프로세스 순서대로 올바르게 나열한 것은?',['4 – 3 – 5 – 2 – 1','4 – 5 – 3 – 1 – 2','5 – 4 – 1 – 3 – 2','5 – 4 – 3 – 2 – 1'],1,'계획(4) → 착수(5) → 개별 리뷰(3) → 의사소통 및 분석(1) → 수정 및 보고(2).'],
['D-18','K1','3.2.3','리뷰 회의가 효과적으로 진행되고, 참석한 모든 사람이 의견을 자유롭게 표현할 수 있도록 하는 책임을 가진 참가자는?',['관리자','중재자','위원장','리뷰 리더'],1,'중재자(퍼실리테이터)는 회의 진행과 안전한 환경 조성을 맡아요.'],
['D-19','K2','4.1.1','전자 상거래 웹 앱의 시스템 테스팅에서 다음 요구사항이 제공되었다.\n\nREQ 05-017. 총 구매 비용이 $100를 초과하는 경우 고객은 이후 구매 시 5% 할인을 받는다. $100를 초과하지 않는 고객에게는 할인이 제공되지 않는다.\n\n이 요구사항으로 테스트 케이스를 설계하는 데 가장 적합한 테스트 기법은?',['화이트박스 테스트 기법','블랙박스 테스트 기법','경험 기반 테스트 기법','리스크 기반 테스트 기법'],1,'기대 동작을 명시한 요구사항이고 $100 경계가 있으니, 경계값 분석 같은 블랙박스 기법이 가장 적합해요.'],
['D-20','K3','4.2.1','영화 예매 시스템은 D = 현재 연도(CY) − 출생 연도(BY)로 할인 유형을 정한다.\n• D < 0: 오류 메시지\n• 0 ≤ D < 18: 학생 할인\n• 18 ≤ D < 65: 할인 없음\n• D ≥ 65: 경로 할인\n\n이미 있는 테스트: (BY=1990, CY=2020 → 할인 없음), (BY=2030, CY=2029 → 오류)\n\n할인 유형에 대한 100% 유효 동등 분할 커버리지를 위해 추가해야 하는 테스트 데이터는? (두 개 선택)',['BY = 2001, CY = 2065','BY = 1900, CY = 1965','BY = 1965, CY = 1900','BY = 2011, CY = 2029','BY = 2000, CY = 2000'],[1,4],'아직 커버되지 않은 분할은 학생 할인과 경로 할인이에요. 1965−1900 = 65(경로), 2000−2000 = 0(학생)이에요.'],
['D-21','K3','4.2.2','원예용 냉장 시설의 온도 제어 시스템은 정수 온도를 입력받는다. 0도 이상 2도 이하면 “적정 온도”, 그보다 낮으면 “온도가 너무 낮음”, 높으면 “온도가 너무 높음”을 표시한다.\n\n2값 경계값 분석으로 가장 높은 경계값 커버리지를 제공하는 테스트 입력 세트는?',['−1, 3','0, 2','−1, 0, 2, 3','−2, 0, 2, 4'],2,'분할 {…−1}, {0, 1, 2}, {3…}의 경계값은 −1, 0, 2, 3이에요.'],
['D-22','K3','4.2.3','다음 결정 테이블로 테스트 케이스를 설계하고 있다(나이 / 경험 / 등록 → 분류).\n\nR1: 0-18 / - / NO → A\nR2: 19-65 / 0-4 / NO → A\nR3: 19-65 / >4 / NO → B\nR4: >65 / - / NO → B\nR5: 0-18 / - / YES → B\nR6: 19-65 / - / YES → D\nR7: >65 / - / YES → C\n\n기존 테스트:\nTC1: 19세, 경험 없음, 미등록 → A\nTC2: 65세, 5년 경력, 미등록 → B\nTC3: 66세, 경험 없음, 등록 → C\nTC4: 65세, 4년 경력, 등록 → D\n\n추가하면 결정 테이블 커버리지를 증가시킬 테스트 케이스는?',['66세, 경험 없음, 미등록 → 분류 B','55세, 2년 경력, 미등록 → 분류 A','19세, 5년 경력, 등록 → 분류 D','이미 달성된 커버리지를 더 높일 수 있는 테스트 케이스는 없다'],0,'기존 TC는 R2, R3, R7, R6을 커버해요. a는 아직 커버되지 않은 R4에 해당해요.'],
['D-23','K3','4.2.4','호텔 객실 예약 시스템의 상태 전이 테이블이다.\n\nS1 요청 중 --예약 가능--> S2 확인됨\nS1 요청 중 --예약 불가--> S3 대기자 명단\nS2 확인됨 --객실 변경--> S1 요청 중\nS2 확인됨 --취소--> S4 종료\nS2 확인됨 --결제--> S4 종료\nS3 대기자 명단 --예약 가능--> S2 확인됨\nS3 대기자 명단 --취소--> S4 종료\n\n모든 테스트가 ‘요청 중’에서 시작할 때, 가장 높은 유효 전이 커버리지를 달성하는 것은?',['예약 불가, 예약 가능, 객실 변경, 예약 불가, 취소','예약 가능, 객실 변경, 예약 불가, 예약 가능, 결제','예약 가능, 객실 변경, 예약 가능, 객실 변경, 예약 불가','예약 불가, 취소, 객실 변경, 예약 가능, 결제'],1,'b는 S1→S2, S2→S1, S1→S3, S3→S2, S2→S4로 서로 다른 5개 전이(7개 중)를 커버해요. d는 취소 후 종료돼 실행할 수 없어요.'],
['D-24','K2','4.3.1','프로그램 P에 대한 테스트 스위트 S는 100% 구문 커버리지를 달성한다. S는 세 개의 테스트 케이스로 구성되고, 각각 50% 구문 커버리지를 달성한다.\n\n다음 중 올바른 설명은?',['S를 실행하면 P에서 나타날 수 있는 모든 장애가 발생하게 된다','S는 P에 대해 100% 분기 커버리지를 달성한다','결함이 있는 P의 모든 실행문은 S 실행 중 최소 한 번은 실행된다','S에서 테스트 케이스 하나를 빼도 나머지 둘로 100% 구문 커버리지를 달성한다'],2,'100% 구문 커버리지는 모든 실행 가능한 구문이 최소 한 번 실행됐다는 뜻이에요. 결함 구문이 실행돼도 항상 장애가 나는 건 아니에요.'],
['D-25','K2','4.3.3','소프트웨어 명세가 모호하고 오래되었거나 불완전한 경우에도 화이트박스 테스팅으로 결함 식별이 가능한 이유는?',['테스트 케이스가 명세가 아닌 테스트 대상의 구조를 기반으로 설계되기 때문','어떤 화이트박스 기법이든 커버리지를 명확하게 정의하고 쉽게 측정할 수 있기 때문','화이트박스 테스트 기법은 요구사항 누락을 식별하기 매우 좋게 설계돼 있기 때문','화이트박스 테스트 기법은 정적 테스팅과 동적 테스팅 모두에 사용할 수 있기 때문'],0,'화이트박스는 명세가 아니라 구현 구조를 보기 때문에 명세가 부실해도 결함을 찾을 수 있어요.'],
['D-26','K2','4.4.1','다음 중 오류 추정을 적용할 때 테스터가 예상할 수 없는 것은?',['개발자가 이자 계산 사용자 스토리의 공식을 잘못 이해한다','개발자가 소스코드에 “FA = A*(1+IR)^N” 대신 “FA = A*(1+IR^N)”라고 작성한다','개발자가 새로운 복리 이율 법안에 관한 세미나를 놓친다','시스템이 계산하는 이자의 정확성이 충분하지 않다'],2,'세미나를 놓친 것은 잠재적 근본 원인이지 오류·결함·장애가 아니라서 테스터가 예상하기 어려워요.'],
['D-27','K2','4.4.2','다음 중 탐색적 테스팅에 대한 설명으로 옳은 것은?',['탐색적 테스팅 세션을 시작하기 전에 테스트 케이스를 설계한다','테스터는 테스트 실행은 할 수 있지만 테스트 설계는 할 수 없다','탐색적 테스팅의 결과는 잔존 결함 수를 예측하는 좋은 지표가 된다','탐색적 테스팅 중에 테스터는 블랙박스 테스트 기법을 사용할 수 있다'],3,'탐색적 테스팅 중에는 유용하다고 생각하는 어떤 기법이든 쓸 수 있어요. 설계·실행·평가는 동시에 이뤄져요.'],
['D-28','K2','4.5.1','팀이 전달해야 하는 내용에 대한 공통된 이해를 달성할 협업 사용자 스토리 작성 방법은?',['사용자 스토리 구현에 필요한 노력에 대해 합의를 도출할 수 있는 플래닝 포커','사용자 스토리에서 불일치와 모순을 식별할 수 있게 해주는 리뷰','최상의 비즈니스 가치를 가진 스토리에 우선순위를 줄 수 있게 하는 반복주기 계획','팀 멤버들이 소프트웨어가 사용될 방법을 이해할 수 있게 해주는 대화'],3,'3C 중 대화(Conversation)가 소프트웨어의 사용 방식을 공유해 공통 이해를 만들어요.'],
['D-29','K3','4.5.3','사용자 스토리: “고객으로서 나는 가격 범위로 검색 결과를 필터링해서 내 예산 범위에 들어오는 제품을 좀 더 쉽게 찾을 수 있기를 원한다.”\n\n인수 조건:\n1. 필터는 버전 3.0 이상인 모든 애플리케이션 버전에서 동작해야 한다\n2. 필터는 고객이 최소 및 최대 가격을 설정할 수 있게 해야 한다\n3. 고객이 가격 필터를 조정하면 검색 결과는 동적으로 업데이트되어야 한다\n\n사전 조건: 제품 A($100)와 B($110) 두 가지만 있다.\n\n이 사용자 스토리에 대한 테스트 케이스로 가장 적절한 것은?',['$90~$100로 필터를 설정하면 A만 보인다. 최대 가격을 $110으로 바꾸면 A와 B 모두 보인다','기본 최소·최대 가격이 $100·$110이다. $120짜리 제품 C를 추가하고 새로고침하면 기본 최대 가격이 $120이 된다','$90~$115로 설정하면 A와 B가 보인다. 통화를 USD에서 EUR로 바꾸면 필터 범위가 환율에 맞게 바뀐다','엣지, 크롬, 오페라에서 $90~$110로 설정하면 A와 B가 보이고 결과 레이아웃이 모두 같다'],0,'a는 가격 범위 설정(AC2)과 동적 업데이트(AC3)를 확인해요. 나머지는 인수 조건에 없는 기능을 확인해요.'],
['D-30','K2','5.1.3','다음 중 테스트 프로젝트의 완료 조건으로 가장 적절한 것은? (두 개 선택)',['예산이 승인된다','예산이 소진된다','테스트 베이시스가 가용하다','테스트 케이스로 최소 80%의 구문 커버리지를 달성했다','모든 테스트 분석가가 ISTQB Foundation Level 자격 취득자이다'],[1,3],'예산 소진과 커버리지 달성은 완료 조건이에요. 예산 승인, 베이시스 가용성, 인력 자격은 시작 조건이에요.'],
['D-31','K3','5.1.4','팀은 한 명의 테스터가 테스트 케이스 4개를 실행하는 시간을 추정하려 한다. 테스트 케이스 1개 실행에 대한 측정값은 다음과 같다.\n• 가장 낙관적인 추정치: 1시간\n• 가장 비관적인 추정치: 8시간\n• 가장 가능성이 높은 추정치: 3시간\n\n3점 추정 기법으로 4개를 모두 실행하는 데 필요한 시간의 최종 추정치는?',['14시간','3.5시간','16시간','12시간'],0,'1개당 (1 + 4×3 + 8) / 6 = 3.5시간이고, 4개면 3.5 × 4 = 14시간이에요.'],
['D-32','K3','5.1.5','테스트 케이스에서 요구사항으로의 추적성 행렬이다.\n\nTC1: Req1, Req3, Req4, Req7\nTC2: Req1, Req5, Req7\nTC3: Req5, Req6\nTC4: Req2\n\n커버리지 기반 우선순위 지정 기법으로 네 개를 모두 실행할 때, 마지막으로 실행해야 하는 테스트 케이스는?',['TC1','TC2','TC3','TC4'],1,'TC1(4개) → 남은 Req2·5·6 중 2개를 커버하는 TC3 → Req2를 커버하는 TC4 → 추가 커버리지가 없는 TC2가 마지막이에요.'],
['D-33','K2','5.1.7','테스팅 사분면은 테스팅에 어떻게 도움이 될 수 있는가?',['네 가지 테스트 레벨에 따라 테스트 프로세스를 네 단계로 나누어 계획하는 데 도움이 된다','하위 수준 커버리지를 기반으로 상위 수준 커버리지를 평가하는 데 도움이 된다','기술적 배경이 부족한 이해관계자가 다양한 테스트 유형과, 테스트 레벨에 따라 관련성 높은 유형이 다르다는 것을 이해하는 데 도움이 된다','애자일 팀이 네 가지 심리 유형으로 사람을 분류해 커뮤니케이션 전략을 세우도록 돕는다'],2,'사분면은 테스트 유형, 지원하는 활동(팀 지원/제품 평가), 관점(비즈니스/기술)의 관계를 이해하게 해줘요.'],
['D-34','K1','5.2.1','어떤 리스크의 리스크 수준이 $1,000이고 발생 가능성이 50%로 추정된다면, 리스크 영향도로 적절한 것은?',['$500','$2,000','$50,000','$200'],1,'리스크 수준 = 가능성 × 영향이므로 영향 = $1,000 ÷ 0.5 = $2,000이에요.'],
['D-35','K2','5.2.2','다음 중 제품 리스크인 것은? (두 개 선택)',['개발 범위 증가','낮은 품질의 아키텍처','예산 감소','열악한 도구 지원','너무 긴 응답시간'],[1,4],'아키텍처 품질과 응답시간은 제품 특성이라 제품 리스크예요. 나머지는 프로젝트 리스크예요.'],
['D-36','K2','5.3.2','다음 중 테스트 보고서의 유효한 목적이 아닌 것은?',['테스트 진행 상황 추적과 추가 노력이 필요한 영역 식별','실행된 테스트와 테스트 결과, 식별된 결함의 정보 제공','재현 절차 등 각 결함에 대한 정보 제공','다음 기간에 예정된 테스트에 대한 정보 제공'],2,'개별 결함의 재현 절차는 결함 보고서의 목적이지 테스트 보고서의 목적이 아니에요.'],
['D-37','K2','5.4.1','사용자가 소프트웨어 장애를 보고했다. 지원팀 엔지니어가 장애가 관찰된 버전을 물었고, 버전 번호를 기반으로 팀은 릴리스를 구성한 모든 파일을 재구성했다. 덕분에 개발자가 장애를 분석해 결함을 수정할 수 있었다. 팀이 이 활동을 할 수 있었던 이유는?',['리스크 관리','테스트 모니터링과 제어','전체 팀 접근법','형상 관리'],3,'형상 관리는 베이스라인별 구성 항목을 기록해 이전 버전을 재구성할 수 있게 해줘요.'],
['D-38','K3','5.5.1','도서 대출 시스템의 결함 보고서이다.\n\n결함 ID: 001 / 제목: 도서를 반납할 수 없다 / 심각도: 높음 / 우선순위: (비어 있음)\n환경: 윈도우 10, 구글 크롬\n설명: 반납하려고 하면 시스템이 반납을 등록하지 않고 대출 상태로 유지된다.\n재현 절차: 도서를 대출한 사용자로 로그인 → 대출된 도서의 “도서 반납” 클릭 → 반납이 등록되지 않는다\n기대 결과: 반납이 처리되어 더 이상 대여 중으로 표시되지 않는다\n실제 결과: 대출 상태로 남아 있다\n첨부파일: 없음\n\n개발자가 장애를 신속하게 재현하는 데 가장 도움이 되는 것은?',['설명란에 해당 장애가 어떤 사용자와 어떤 도서에 영향을 미치는지 정보를 추가한다','우선순위란에 누락된 값을 입력한다','재현 절차의 각 단계마다 수집한 메모리 덤프와 DB 스냅샷을 첨부한다','다양한 환경에서 같은 테스트를 반복하고 각각 결함 보고서를 작성한다'],0,'구체적인 사용자와 도서 정보가 있으면 개발자가 같은 데이터로 바로 재현할 수 있어요. 우선순위는 재현에 도움이 안 되고, 덤프는 과해요.'],
['D-39','K2','6.1.1','다음과 같은 테스트 도구 분류가 있다.\n\ni. 협업 도구\nii. 데브옵스 도구\niii. 관리 도구\niv. 비기능 테스팅 도구\nv. 테스트 설계 및 구현 도구\n\n테스트 실행에 가장 도움이 되는 도구 분류는?',['i, v','ii, iv','i, iii, v','ii, iii, iv'],1,'데브옵스 도구(CI/CD 파이프라인)와 비기능 테스팅 도구가 테스트 실행을 도와요.'],
['D-40','K1','6.2.1','다음 중 테스트 자동화의 리스크로 가장 적절한 것은?',['심각도가 높은 결함의 추가 식별','사람이 도출하기에 너무 복잡한 지표 제공','개발 플랫폼과의 호환성 부족','테스트 실행 시간의 대폭적인 단축'],2,'자동화 도구가 개발 플랫폼과 호환되지 않으면 테스트 대상과 통합할 수 없어요. 나머지는 이점이에요.']
];

['기본','품질 보증 (QA)','Quality Assurance','qa','좋은 품질이 나오도록 “일하는 방식(프로세스)”을 관리하고 개선하는 활동. 문제를 예방하는 데 초점이 있어요.','개발 규칙 정하기, 리뷰 절차 만들기'],

['기본','벨리데이션','Validation','확인 타당성','“사용자가 정말 원하는 걸 만들었나?”를 확인하는 것. 문서대로 만들었어도 사용자가 못 쓰면 실패예요.',''],

['기본','테스트웨어','Testware','','테스트 과정에서 만들어지는 모든 산출물. 테스트 계획서, 테스트 케이스, 테스트 데이터, 보고서 등.',''],
['기본','추적성','Traceability','트레이서빌리티 연결','요구사항 ↔ 테스트 케이스 ↔ 테스트 결과 ↔ 결함을 서로 연결해 두는 것. “이 요구사항은 어떤 테스트로 확인했지?”에 답할 수 있게 해줘요.',''],
['개발 방식','SDLC','Software Development Lifecycle','소프트웨어 개발 수명주기 생명주기','소프트웨어를 기획부터 개발, 테스트, 배포, 유지보수까지 만드는 전체 과정과 그 방식.',''],
['개발 방식','순차적 개발 (폭포수)','Sequential / Waterfall','워터폴 waterfall','요구사항 → 설계 → 개발 → 테스트 순서로 한 단계씩 끝내고 다음으로 넘어가는 방식. 실행 가능한 프로그램이 후반에야 나와요.',''],
['개발 방식','V 모델','V-model','브이모델','순차적 개발의 한 종류. 각 개발 단계마다 짝이 되는 테스트 레벨이 있어요(요구사항 ↔ 인수 테스트, 설계 ↔ 시스템 테스트 등).',''],
['개발 방식','반복적 개발','Iterative Development','이터레이션','짧은 주기를 여러 번 반복하며 조금씩 완성해 가는 방식. 주기마다 동작하는 결과물이 나와요.',''],
['개발 방식','점진적 개발','Incremental Development','증분','기능을 조각(증분) 단위로 나눠 하나씩 덧붙여 가는 방식.',''],
['개발 방식','애자일','Agile','애자일개발 agile 민첩','변화에 빠르게 대응하려고 짧은 주기(보통 1~4주)로 개발·테스트·피드백을 반복하는 개발 방식이자 문화. 두꺼운 문서보다 협업과 “동작하는 소프트웨어”를 중시해요.','2주마다 기능 일부를 완성해 고객에게 보여주고, 의견을 받아 다음 2주 계획을 세우는 것'],
['개발 방식','애자일 테스팅','Agile Testing','애자일테스트','애자일 방식 안에서 하는 테스팅. 개발이 다 끝난 뒤가 아니라 반복주기마다 개발과 함께 테스트하고, 테스터도 처음부터 팀원으로 참여해요. 자주 바뀌니 자동화된 리그레션 테스트가 특히 중요해요.',''],
['개발 방식','스크럼','Scrum','','가장 널리 쓰이는 애자일 방법 중 하나. 스프린트, 제품 백로그, 데일리 미팅, 회고 같은 규칙이 있어요.',''],
['개발 방식','반복주기 / 스프린트','Iteration / Sprint','이터레이션 스프린트','애자일에서 정해 둔 짧은 개발 기간(보통 1~4주). 이 기간 안에 계획·개발·테스트를 모두 해요.',''],
['개발 방식','사용자 스토리','User Story','유저스토리','사용자 입장에서 원하는 기능을 짧게 적은 것. “○○로서, 나는 △△를 원한다. □□하기 위해” 형식이 많아요.','“회원으로서, 나는 주문 내역을 보고 싶다. 지난 구매를 확인하기 위해”'],
['개발 방식','제품 백로그','Product Backlog','백로그','앞으로 만들어야 할 기능(사용자 스토리) 목록. 우선순위 순으로 정렬해 관리해요.',''],
['개발 방식','제품 소유자 (PO)','Product Owner','po 프로덕트오너','애자일 팀에서 무엇을 먼저 만들지 정하고 제품 백로그를 관리하는 사람. 비즈니스 쪽을 대표해요.',''],
['개발 방식','비즈니스 분석가 (BA)','Business Analyst','ba 기획자','비즈니스 요구를 분석해서 요구사항으로 정리하는 사람. 기획자에 가까워요.',''],
['개발 방식','회고','Retrospective','레트로','반복주기가 끝날 때 팀이 모여 “잘된 점, 아쉬운 점, 다음에 바꿀 점”을 이야기하는 회의. 일하는 방식을 개선하는 게 목적이에요.',''],
['개발 방식','전체 팀 접근법','Whole Team Approach','홀팀','품질은 테스터만의 책임이 아니라 팀 전체의 책임이라는 생각. 개발자·테스터·기획자가 함께 협업해요.',''],
['개발 방식','데브옵스','DevOps','devops','개발(Dev)과 운영(Ops)이 한 팀처럼 협업해서 소프트웨어를 빠르고 안정적으로 자주 배포하는 문화와 방식. 자동화(CI/CD)가 핵심이에요.',''],
['개발 방식','지속적 통합 (CI)','Continuous Integration','ci 씨아이','개발자가 코드를 자주(하루에도 여러 번) 합치고, 합칠 때마다 자동으로 빌드·테스트하는 것.',''],
['개발 방식','지속적 전달·배포 (CD)','Continuous Delivery / Deployment','cd 씨디','테스트를 통과한 코드를 언제든(또는 자동으로) 실제 서비스에 배포할 수 있게 하는 것.',''],
['개발 방식','배포 파이프라인','Deployment Pipeline','파이프라인','코드 제출 → 빌드 → 자동 테스트 → 배포까지 이어지는 자동화된 흐름.',''],
['개발 방식','시프트 레프트','Shift-Left','쉬프트레프트 shift left 조기테스팅','테스트를 개발 일정표의 “왼쪽”, 즉 더 앞쪽(초기)으로 당겨서 하는 것. 문제를 일찍 찾을수록 고치는 비용이 싸기 때문이에요.','코드를 짜기 전에 요구사항 문서부터 리뷰하기, 코드보다 테스트를 먼저 작성하기'],
['개발 방식','시프트 라이트','Shift-Right','쉬프트라이트 shift right','배포 이후 실제 운영 환경에서도 모니터링하며 테스트하는 것. 시프트 레프트와 반대 방향이에요.',''],
['개발 방식','테스트 주도 개발 (TDD)','Test-Driven Development','tdd','코드를 짜기 전에 그 코드를 확인할 단위 테스트를 먼저 작성하고, 그 테스트를 통과하도록 코드를 만드는 방식.',''],
['개발 방식','인수 테스트 주도 개발 (ATDD)','Acceptance Test-Driven Development','atdd','인수 조건(사용자 관점의 합격 기준)으로 테스트를 먼저 만들고, 그걸 통과하도록 개발하는 방식.',''],
['개발 방식','행위 주도 개발 (BDD)','Behavior-Driven Development','bdd','기대하는 동작을 Given/When/Then 같은 쉬운 문장으로 먼저 쓰고, 그걸 바탕으로 개발·테스트하는 방식.',''],
['개발 방식','릴리스','Release','배포 출시','완성된 소프트웨어 버전을 사용자에게 내보내는 것, 또는 그 버전.',''],
['개발 방식','빌드','Build','','작성한 코드를 실행 가능한 프로그램으로 만드는 것, 또는 그 결과물.',''],
['테스트 활동','테스트 프로세스','Test Process','','테스트를 진행하는 7가지 활동: 계획 → 모니터링·제어 → 분석 → 설계 → 구현 → 실행 → 완료.',''],
['테스트 활동','테스트 계획','Test Planning','테스트계획서','무엇을, 언제, 누가, 어떻게 테스트할지 정하는 것. 목표·범위·일정·자원·리스크 등을 정리해요.',''],
['테스트 활동','테스트 모니터링과 제어','Test Monitoring & Control','','진행 상황을 계속 확인하고(모니터링), 계획과 다르면 조치를 취하는(제어) 활동.',''],
['테스트 활동','테스트 분석','Test Analysis','','요구사항 등을 읽고 “무엇을 테스트할지(테스트 컨디션)”를 찾아내는 단계.',''],
['테스트 활동','테스트 베이시스','Test Basis','테스트 근거','테스트를 설계할 때 근거로 삼는 자료. 요구사항, 사용자 스토리, 설계서, 코드 등.',''],
['테스트 활동','테스트 컨디션','Test Condition','테스트 조건 컨디션','테스트로 확인해야 할 “항목”이나 “측면”. 아직 구체적인 입력값은 없고 “무엇을 확인할지”만 정한 상태예요. 이걸 구체화하면 테스트 케이스가 돼요.','“비밀번호 길이 제한이 동작하는가”, “잘못된 비밀번호를 5번 입력하면 계정이 잠기는가”'],
['테스트 활동','테스트 설계','Test Design','','테스트 컨디션을 “어떻게” 테스트할지 구체화하는 단계. 테스트 케이스와 필요한 데이터·환경을 정해요.',''],
['테스트 활동','테스트 케이스','Test Case','tc 테케','테스트 한 건의 구체적인 내용. 사전 조건, 입력값, 실행 방법, 기대 결과가 들어 있어요.','사전 조건: 로그인 화면 / 입력: 7자리 비밀번호 / 기대 결과: “8자 이상 입력하세요” 표시'],
['테스트 활동','커버리지 항목','Coverage Item','','테스트 기법으로 뽑아낸 “반드시 확인해야 할 대상”. 동등 분할의 각 분할, 경계값의 각 값, 상태 전이의 각 전이 등.',''],
['테스트 활동','테스트 데이터','Test Data','','테스트에 사용하는 입력값과 미리 준비해 둔 데이터.','테스트용 회원 계정, 상품 목록'],
['테스트 활동','기대 결과','Expected Result','예상 결과','테스트를 실행했을 때 “이렇게 나와야 정상”이라고 미리 정해 둔 결과. 실제 결과와 비교해 합격/실패를 판단해요.',''],
['테스트 활동','사전 조건 / 사후 조건','Precondition / Postcondition','전제조건','사전 조건: 테스트 시작 전에 갖춰져야 할 상태. 사후 조건: 테스트 후 시스템이 있어야 할 상태.','사전 조건: “로그인된 상태”'],
['테스트 활동','테스트 구현','Test Implementation','','테스트를 실행할 준비를 하는 단계. 테스트 절차·스크립트 작성, 테스트 데이터 생성, 환경 구축, 실행 일정 정리.',''],
['테스트 활동','테스트 절차','Test Procedure','','여러 테스트 케이스를 실행 순서대로 묶어 놓은 것.',''],
['테스트 활동','테스트 스크립트','Test Script','스크립트','테스트 절차를 자동으로 실행할 수 있게 코드로 작성한 것.',''],
['테스트 활동','테스트 스위트','Test Suite','스위트','함께 실행할 테스트 케이스·절차들의 묶음.','“로그인 기능 테스트 스위트”'],
['테스트 활동','테스트 실행','Test Execution','','테스트를 실제로 수행하고, 실제 결과와 기대 결과를 비교해 기록하는 단계.',''],
['테스트 활동','테스트 완료','Test Completion','','테스트를 마무리하는 단계. 완료 보고서 작성, 재사용할 테스트웨어 정리, 교훈 정리.',''],
['테스트 활동','테스트 차터','Test Charter','차터','탐색적 테스팅에서 “무엇을, 무엇으로, 무엇을 찾기 위해” 탐색할지 적은 짧은 목표 메모.','대상: 결제 화면 / 방법: 이상한 카드번호 입력 / 목적: 잘못된 결제를 허용하는 결함 찾기'],
['테스트 활동','테스트 환경','Test Environment','테스트서버','테스트를 수행하는 데 필요한 하드웨어, 소프트웨어, 네트워크, 데이터 등의 구성.',''],
['테스트 활동','시작 조건','Entry Criteria','진입조건 dor','어떤 테스트 활동을 “시작해도 된다”고 판단하는 기준.','테스트 환경 준비 완료, 테스트할 빌드 배포 완료'],
['테스트 활동','완료 조건','Exit Criteria','종료조건 dod','테스트를 “끝내도 된다”고 판단하는 기준.','요구사항 커버리지 100%, 치명적 결함 0건'],
['테스트 활동','테스트 로그','Test Log','실행기록','테스트 실행 과정과 결과를 기록한 것.',''],
['레벨·유형','테스트 레벨','Test Level','','개발 단계에 맞춰 나눈 테스트 묶음. 작은 단위부터 컴포넌트 → 컴포넌트 통합 → 시스템 → 시스템 통합 → 인수 테스팅.',''],
['레벨·유형','컴포넌트 테스팅 (단위 테스팅)','Component / Unit Testing','유닛테스트 단위테스트','함수나 클래스 같은 가장 작은 코드 조각을 따로 떼어 테스트하는 것. 보통 개발자가 해요.',''],
['레벨·유형','컴포넌트 통합 테스팅','Component Integration Testing','단위통합','컴포넌트를 합쳤을 때 서로 데이터를 잘 주고받는지(인터페이스) 확인하는 테스트.','화면과 데이터베이스 사이의 연동 확인'],
['레벨·유형','시스템 테스팅','System Testing','','완성된 전체 시스템이 요구사항대로 동작하는지 기능·비기능 모두 확인하는 테스트.',''],
['레벨·유형','시스템 통합 테스팅','System Integration Testing','','우리 시스템과 외부 시스템(결제사, 은행 등)이 잘 연동되는지 확인하는 테스트.',''],

 if(typeof CH==='undefined')miss.push('CH');
 if(typeof SEC==='undefined')miss.push('SEC');
 if(typeof LO==='undefined')miss.push('LO');
 if(typeof GL==='undefined')miss.push('GL');
 if(typeof RAW==='undefined')miss.push('RAW');
 if(typeof DICT==='undefined')miss.push('DICT');
 if(miss.length){
  document.getElementById('app').innerHTML=`<div class="box">⚠️ 데이터가 빠졌어요: <b>${miss.join(', ')}</b><br>1부·2부·3부를 순서대로 빠짐없이 이어 붙였는지 확인해 주세요.</div>`;
  throw new Error('데이터 누락: '+miss.join(', '));

})();

/* ───── 1. 설정 ───── */
const CFG={passRate:0.65,examMinutes:60,maxPool:20,letters:'abcde',dist:{1:8,2:6,3:4,4:11,5:9,6:2}};
const KEYS={seen:'ctfl_seen_v2',wrong:'ctfl_wrong_v1',instant:'ctfl_instant',theme:'ctfl_theme'};

/* ───── 2. 유틸 ───── */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const num=x=>Number.isInteger(x)?String(x):String(Math.round(x*100)/100);
const usd=x=>'$'+Math.round(x).toLocaleString('en-US');
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const chOf=lo=>+lo[0];
function highlight(text,kw){
 const t=esc(text);if(!kw)return t;
 const k=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 return t.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>');
}
function render(html,{scroll=true}={}){$('app').innerHTML=html;if(scroll)window.scrollTo(0,0);}

/* ───── 3. 저장소 ───── */
const Store={
 get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const Settings={
 instant:Store.get(KEYS.instant,false),
 setInstant(v){this.instant=v;Store.set(KEYS.instant,v);}
};
const Progress={
 seen:Store.get(KEYS.seen,{}),
 wrong:Store.get(KEYS.wrong,{}),
 save(){Store.set(KEYS.seen,this.seen);Store.set(KEYS.wrong,this.wrong);},
 record(qs,answers){
  let added=0;
  qs.forEach((q,i)=>{
   this.seen[q.s]=(this.seen[q.s]||0)+1;
   if(Grade.isCorrect(q,answers[i]))delete this.wrong[q.s];
   else{this.wrong[q.s]=(this.wrong[q.s]||0)+1;added++;}
  });
  this.save();return added;
 },
 removeWrong(id){delete this.wrong[id];this.save();},
 clearWrong(){this.wrong={};this.save();},
 clearSeen(){this.seen={};this.save();}
};

/* ───── 4. 테마 ───── */
const Theme={
 init(){
  const sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  this.apply(Store.get(KEYS.theme,null)||sys);
 },
 apply(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'☀️':'🌙';},
 toggle(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';Store.set(KEYS.theme,t);this.apply(t);}
};

/* ───── 5. 숫자 자동 생성 문제 ───── */
const GENERATORS=[
 {id:'G-BVA',lo:'4.2.2',k:'K3',name:'경계값 분석 계산',make(){
  const lo=rand(1,60),hi=lo+rand(6,40),v3=Math.random()<.5;
